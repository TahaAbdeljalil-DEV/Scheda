<style>/* Scheda: app da palestra, layout a una colonna con barra in basso. Neutri freddi "gesso e ghisa", accento preso dai colori dei dischi olimpici. */
:root{
  --bg:#F3F4F6; --surface:#FFFFFF; --surface-2:#ECEEF1; --surface-3:#E2E5EA;
  --line:rgba(17,22,30,.09); --text:#12161D; --text-2:#5C6470; --text-3:#6E7681;
  --good:#17905A; --warn:#C27C00; --bad:#D6362F;
  --accent:#1D5BDB; --accent-ink:#FFFFFF; --accent-soft:rgba(29,91,219,.12); --accent-bg:var(--accent);
  --shadow:0 1px 2px rgba(17,22,30,.06),0 4px 16px rgba(17,22,30,.06);
  --scrim:rgba(8,10,14,.45);
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-num:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --r-lg:18px; --r-md:13px; --r-sm:9px;
  --tab-h:58px; --fs:1;
  color-scheme:light;
}
:root[data-accent="red"]{--accent:#D8322C;--accent-soft:rgba(216,50,44,.12);--accent-ink:#fff;--accent-bg:var(--accent)}
:root[data-accent="yellow"]{--accent:#C99500;--accent-soft:rgba(201,149,0,.14);--accent-ink:#1a1400;--accent-bg:var(--accent)}
:root[data-accent="green"]{--accent:#138A4F;--accent-soft:rgba(19,138,79,.13);--accent-ink:#fff;--accent-bg:var(--accent)}
:root[data-accent="iron"]{--accent:#2A313C;--accent-soft:rgba(42,49,60,.10);--accent-ink:#fff;--accent-bg:var(--accent)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0C0F; --surface:#15181D; --surface-2:#1E2228; --surface-3:#282D35;
    --line:rgba(255,255,255,.08); --text:#F1F3F6; --text-2:#A2A9B4; --text-3:#8A929E;
    --good:#3CCB85; --warn:#F2B33D; --bad:#FF5F57;
    --accent:#6B9BFF; --accent-soft:rgba(77,132,255,.16); --accent-ink:#fff; --accent-bg:#2F66E0;
    --shadow:none; --scrim:rgba(0,0,0,.6); color-scheme:dark;
  }
  :root:not([data-theme="light"])[data-accent="red"]{--accent:#FF6B64;--accent-soft:rgba(255,82,75,.16);--accent-bg:#C9302A}
  :root:not([data-theme="light"])[data-accent="yellow"]{--accent:#FFC830;--accent-soft:rgba(255,200,48,.15);--accent-ink:#1a1400;--accent-bg:var(--accent)}
  :root:not([data-theme="light"])[data-accent="green"]{--accent:#34C77F;--accent-soft:rgba(52,199,127,.15);--accent-ink:#04140b;--accent-bg:var(--accent)}
  :root:not([data-theme="light"])[data-accent="iron"]{--accent:#E6E9EE;--accent-soft:rgba(230,233,238,.12);--accent-ink:#0A0C0F;--accent-bg:var(--accent)}
}
:root[data-theme="dark"]{
  --bg:#0A0C0F; --surface:#15181D; --surface-2:#1E2228; --surface-3:#282D35;
  --line:rgba(255,255,255,.08); --text:#F1F3F6; --text-2:#A2A9B4; --text-3:#8A929E;
  --good:#3CCB85; --warn:#F2B33D; --bad:#FF5F57;
  --accent:#6B9BFF; --accent-soft:rgba(77,132,255,.16); --accent-ink:#fff; --accent-bg:#2F66E0;
  --shadow:none; --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
:root[data-theme="dark"][data-accent="red"]{--accent:#FF6B64;--accent-soft:rgba(255,82,75,.16);--accent-bg:#C9302A}
:root[data-theme="dark"][data-accent="yellow"]{--accent:#FFC830;--accent-soft:rgba(255,200,48,.15);--accent-ink:#1a1400;--accent-bg:var(--accent)}
:root[data-theme="dark"][data-accent="green"]{--accent:#34C77F;--accent-soft:rgba(52,199,127,.15);--accent-ink:#04140b;--accent-bg:var(--accent)}
:root[data-theme="dark"][data-accent="iron"]{--accent:#E6E9EE;--accent-soft:rgba(230,233,238,.12);--accent-ink:#0A0C0F;--accent-bg:var(--accent)}
:root[data-big="1"]{--fs:1.18}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--f-ui);font-size:calc(16px*var(--fs));line-height:1.4;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
input,textarea,select{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
svg.i{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:18px;height:18px}
svg.i.lg{width:28px;height:28px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* ---------- shell ---------- */
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.scroller{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
.page{padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 28px);max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.page.no-tab{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 32px)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);
  padding:6px 8px calc(env(safe-area-inset-bottom,0px) + 4px);background:color-mix(in srgb,var(--surface) 88%,transparent);
  -webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border-top:1px solid var(--line)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--text-2);font-size:11px;font-weight:600;letter-spacing:.01em}
.tabbar button[aria-current="page"]{color:var(--accent)}
.tabbar svg.i{width:25px;height:25px}

/* ---------- headers ---------- */
.hdr{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;min-height:44px}
.hdr h1{margin:0;font-size:calc(32px*var(--fs));line-height:1.05;letter-spacing:-.02em;font-weight:800;text-wrap:balance}
.eyebrow{font-size:13px;font-weight:600;color:var(--text-2);letter-spacing:.02em}
.navbar{position:sticky;top:0;z-index:15;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;
  padding:calc(env(safe-area-inset-top,0px) + 6px) 8px 8px;background:color-mix(in srgb,var(--bg) 86%,transparent);
  -webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px)}
.navbar .ttl{font-weight:700;font-size:17px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw}
.navbar .l{justify-self:start}.navbar .r{justify-self:end;display:flex;gap:4px}
.navbtn{display:inline-flex;align-items:center;gap:2px;min-height:40px;padding:0 8px;border-radius:10px;color:var(--accent);font-weight:600;font-size:17px}
.navbtn:active{background:var(--accent-soft)}
.page.sub{padding-top:8px}
h2.sec{margin:6px 0 -6px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2)}
.sec-row{display:flex;justify-content:space-between;align-items:center;margin:6px 0 -6px}
.sec-row h2.sec{margin:0}
.link{color:var(--accent);font-weight:600;font-size:15px}

/* ---------- surfaces ---------- */
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);border:1px solid var(--line)}
.pad{padding:16px}
.list{background:var(--surface);border-radius:var(--r-lg);border:1px solid var(--line);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;min-height:52px;width:100%;text-align:left}
.row + .row{border-top:1px solid var(--line)}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600}
.row .s{font-size:13px;color:var(--text-2);margin-top:1px}
.row .chev{color:var(--text-3)}
button.row:active,.row.tap:active{background:var(--surface-2)}
.muted{color:var(--text-2)}.faint{color:var(--text-3)}
.small{font-size:13px}.tiny{font-size:11.5px}
.empty{text-align:center;padding:28px 16px;color:var(--text-2);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty svg.i{width:34px;height:34px;color:var(--text-3)}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.hstack{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;font-weight:700;font-size:16px;
  background:var(--surface-2);color:var(--text);transition:transform .12s ease,opacity .12s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent-bg);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:11px}
.btn[disabled]{opacity:.45;pointer-events:none}
.iconbtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;color:var(--text-2)}
.iconbtn:active{background:var(--surface-2)}
.iconbtn.acc{color:var(--accent)}
.fab{position:fixed;right:18px;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 18px);z-index:19;width:56px;height:56px;border-radius:18px;
  display:grid;place-items:center;background:var(--accent-bg);color:var(--accent-ink);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.fab svg.i{width:26px;height:26px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row > *{flex:1 1 auto}

/* ---------- chips / pills ---------- */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 13px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--text-2)}
.chip[aria-pressed="true"]{background:var(--accent-bg);border-color:transparent;color:var(--accent-ink)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--text-2)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.good{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;min-height:34px;border-radius:9px;font-weight:600;font-size:14px;color:var(--text-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days button{min-height:42px;border-radius:12px;background:var(--surface-2);font-weight:700;font-size:14px;color:var(--text-2)}
.days button[aria-pressed="true"]{background:var(--accent-bg);color:var(--accent-ink)}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:6px}
.field > label,.lbl{font-size:13px;font-weight:600;color:var(--text-2)}
.inp,textarea.inp,select.inp{width:100%;min-height:48px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:16px;-webkit-appearance:none;appearance:none}
textarea.inp{min-height:84px;resize:vertical;line-height:1.4}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.inp::placeholder{color:var(--text-3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.switch{position:relative;width:51px;height:31px;flex:none;border-radius:999px;background:var(--surface-3);transition:background .15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .18s ease}
.switch[aria-checked="true"]{background:var(--good)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.swatches{display:flex;gap:12px;flex-wrap:wrap}
.swatch{width:40px;height:40px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--text)}

/* ---------- today ---------- */
.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 7px;border-radius:14px;color:var(--text-2)}
.wd .n{font-family:var(--f-num);font-weight:700;font-size:17px;color:var(--text)}
.wd .l{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.wd .dot{width:6px;height:6px;border-radius:50%;background:transparent}
.wd .dot.plan{background:var(--text-3)}
.wd .dot.done{background:var(--good)}
.wd.today .n{color:var(--accent)}
.wd[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--line)}
.wcard{position:relative;display:flex;gap:14px;align-items:center;padding:16px;background:var(--surface);border-radius:var(--r-lg);border:1px solid var(--line);box-shadow:var(--shadow);width:100%;text-align:left}
.wcard:active{transform:scale(.99)}
.wicon{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;font-size:22px;background:var(--wc,var(--accent-soft));color:#fff}
.wcard .t{font-weight:700;font-size:calc(17px*var(--fs))}
.wcard .s{font-size:13px;color:var(--text-2);margin-top:2px}
.wcard.done{opacity:.72}
.wcard .go{margin-left:auto}
.rest{padding:26px 18px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.rest .big{font-size:calc(40px*var(--fs));font-weight:800;letter-spacing:-.02em}
.banner{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--accent-soft);color:var(--text);font-size:14px;width:100%;text-align:left}
.banner svg.i{color:var(--accent)}
.banner.warn{background:color-mix(in srgb,var(--warn) 14%,transparent)}
.banner.warn svg.i{color:var(--warn)}
.banner.live{background:var(--accent-bg);color:var(--accent-ink)}
.banner.live svg.i{color:var(--accent-ink)}
.meta-row{display:flex;flex-wrap:wrap;gap:6px}
.thumbs{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px 2px;scrollbar-width:none}
.thumbs::-webkit-scrollbar{display:none}
.thumb{flex:none;width:76px;height:96px;border-radius:12px;overflow:hidden;background:var(--surface-2);display:grid;place-items:center;color:var(--text-3);border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb.add{border:1.5px dashed var(--text-3);background:transparent}

/* ---------- workout detail / editor ---------- */
.exrow{display:flex;gap:12px;align-items:center;padding:13px 16px;width:100%;text-align:left}
.exrow + .exrow{border-top:1px solid var(--line)}
.exrow .ix{width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--text-2);flex:none}
.exrow .media-ic{color:var(--accent)}
.grp{border-left:3px solid var(--accent);}
.item-ed{padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px}
.item-ed + .item-ed{border-top:1px solid var(--line)}
.set-ed{display:grid;grid-template-columns:34px 1fr 1fr 34px;gap:6px;align-items:center}
.set-ed .tp{height:36px;border-radius:9px;background:var(--surface-2);font-weight:800;font-size:13px}
.set-ed .tp.W{color:var(--warn)}.set-ed .tp.D{color:var(--accent)}.set-ed .tp.F{color:var(--bad)}
.mini{min-height:38px;padding:6px 10px;border-radius:10px;font-size:16px;text-align:center}
.drag{touch-action:none;color:var(--text-3);cursor:grab}
.dragging{opacity:.9;box-shadow:0 10px 30px rgba(0,0,0,.25);position:relative;z-index:5;background:var(--surface)}

/* ---------- session ---------- */
.sess-top{position:sticky;top:0;z-index:15;padding:calc(env(safe-area-inset-top,0px) + 6px) 12px 10px;background:color-mix(in srgb,var(--bg) 88%,transparent);
  -webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);display:flex;flex-direction:column;gap:8px}
.sess-top .clock{font-family:var(--f-num);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.progress{height:5px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.progress > i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s ease}
.exblock{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.exblock.sup{border-left:4px solid var(--accent)}
.exhead{display:flex;align-items:flex-start;gap:10px;padding:14px 14px 8px}
.exhead .t{font-weight:800;font-size:calc(18px*var(--fs));line-height:1.2}
.prev{font-size:12.5px;color:var(--text-2);margin-top:3px}
.sugg{display:inline-flex;align-items:center;gap:4px;margin-top:6px;padding:4px 9px;border-radius:999px;background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good);font-size:12.5px;font-weight:700}
.sethdr,.setrow{display:grid;grid-template-columns:36px minmax(0,1fr) minmax(0,1fr) 52px;gap:8px;align-items:center;padding:0 12px}
.sethdr{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);padding-bottom:4px}
.sethdr span{text-align:center}
.setrow{position:relative;padding-top:5px;padding-bottom:5px;background:var(--surface);transition:background .15s}
.setrow.done{background:color-mix(in srgb,var(--good) 10%,var(--surface))}
.setrow .no{height:40px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;font-weight:800;font-size:14px;background:var(--surface-2);color:var(--text-2)}
.setrow .no.W{color:var(--warn)}.setrow .no.D{color:var(--accent)}.setrow .no.F{color:var(--bad)}
.setrow .cell{display:flex;align-items:center;gap:0;background:var(--surface-2);border-radius:11px;min-width:0;height:44px}
.setrow .cell input{flex:1;min-width:0;height:44px;border:0;background:transparent;text-align:center;font-family:var(--f-num);font-weight:700;font-size:calc(19px*var(--fs));color:var(--text);padding:0 2px}
.setrow .cell input::placeholder{color:var(--text-3);font-weight:600}
.setrow .cell input:focus{outline:none}
.setrow .cell .st{width:30px;height:44px;flex:none;color:var(--text-2);font-size:20px;font-weight:700;display:grid;place-items:center}
.setrow .cell .st:active{color:var(--accent)}
.setrow .ck{height:44px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--text-3)}
.setrow.done .ck{background:var(--good);color:#fff}
.setrow .snote{grid-column:2 / 4;font-size:12.5px;color:var(--text-2);padding:0 4px}
.swipe-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-weight:700;font-size:13px;color:#fff;pointer-events:none}
.exfoot{display:flex;gap:6px;padding:8px 12px 12px;flex-wrap:wrap}
.restbar{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:30;display:flex;align-items:center;gap:10px;padding:10px 10px 10px 16px;
  border-radius:20px;background:var(--text);color:var(--bg);box-shadow:0 10px 30px rgba(0,0,0,.3);transform:translateY(0);transition:transform .2s ease}
.restbar .tm{font-family:var(--f-num);font-weight:800;font-size:28px;font-variant-numeric:tabular-nums;min-width:78px}
.restbar .rb{min-height:40px;padding:0 12px;border-radius:12px;background:color-mix(in srgb,var(--bg) 14%,transparent);font-weight:700;font-size:15px}
.restbar .ring{height:4px;position:absolute;left:16px;right:16px;bottom:6px;border-radius:4px;background:color-mix(in srgb,var(--bg) 18%,transparent);overflow:hidden}
.restbar .ring i{display:block;height:100%;background:var(--accent)}
.flash{position:fixed;inset:0;z-index:60;background:var(--accent-bg);color:var(--accent-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;animation:flash 1.8s ease forwards;pointer-events:none}
.flash b{font-size:40px;font-weight:800;letter-spacing:-.02em}
@keyframes flash{0%{opacity:0}8%{opacity:1}70%{opacity:1}100%{opacity:0}}

/* ---------- overlays ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);opacity:0;transition:opacity .2s ease}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92%;display:flex;flex-direction:column;background:var(--bg);border-radius:22px 22px 0 0;
  transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px);max-width:680px;margin:0 auto}
.sheet.on{transform:translateY(0)}
.sheet .grab{width:38px;height:5px;border-radius:9px;background:var(--surface-3);margin:8px auto 2px;flex:none}
.sheet .sh-h{display:flex;align-items:center;justify-content:space-between;padding:4px 8px 6px 18px;flex:none}
.sheet .sh-h b{font-size:18px}
.sheet .sh-b{overflow-y:auto;padding:4px 16px 18px;display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.screen{position:fixed;inset:0;z-index:35;background:var(--bg);display:flex;flex-direction:column;animation:slidein .22s cubic-bezier(.2,.8,.2,1)}
@keyframes slidein{from{transform:translateX(24px);opacity:.3}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + var(--tab-h) + 22px);z-index:70;transform:translate(-50%,20px);opacity:0;
  display:flex;align-items:center;gap:12px;max-width:calc(100% - 32px);padding:12px 14px 12px 16px;border-radius:16px;background:var(--text);color:var(--bg);font-weight:600;font-size:15px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);transition:all .22s ease}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast button{color:var(--accent);font-weight:800;padding:4px 6px;filter:brightness(1.3)}
.toast.pr{background:var(--accent-bg);color:var(--accent-ink)}
.quote{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:24px;background:var(--scrim);animation:fade .2s ease}
.quote .qc{max-width:420px;width:100%;background:var(--surface);border-radius:24px;padding:28px 24px 22px;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:pop .28s cubic-bezier(.2,.9,.3,1.2);display:flex;flex-direction:column;gap:14px}
.quote .qk{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.quote .qt{font-size:24px;line-height:1.25;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.quote .qbar{height:3px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.quote .qbar i{display:block;height:100%;background:var(--accent);animation:qbar 4.2s linear forwards}
@keyframes qbar{from{width:100%}to{width:0}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.modal{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:24px;background:var(--scrim);animation:fade .15s ease}
.modal .mc{width:100%;max-width:360px;background:var(--surface);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px;animation:pop .2s ease}
.modal .mc h3{margin:0;font-size:18px}
.modal .mc p{margin:0;color:var(--text-2);font-size:15px}

/* ---------- finish ---------- */
.finish{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;animation:fade .25s ease}
.finish .in{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 28px) 18px calc(env(safe-area-inset-bottom,0px) + 28px);display:flex;flex-direction:column;gap:18px;align-items:stretch}
.medal{position:relative;width:168px;height:168px;margin:6px auto 0;display:grid;place-items:center;border-radius:50%}
.medal svg.ringsvg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.medal .core{width:124px;height:124px;border-radius:50%;background:var(--accent-bg);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 12px 36px color-mix(in srgb,var(--accent) 45%,transparent);animation:medal .5s cubic-bezier(.2,.9,.3,1.3)}
.medal .core svg.i{width:62px;height:62px;stroke-width:2.6}
.medal .core .num{font-size:40px;font-weight:800}
.medal.tap .core{animation:medal .5s cubic-bezier(.2,.9,.3,1.3),pulse 1.6s ease-in-out .6s infinite}
@keyframes medal{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.finish h2{margin:0;text-align:center;font-size:30px;font-weight:800;letter-spacing:-.02em}
.finish .sub{text-align:center;color:var(--text-2);margin-top:-10px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.stat .v{font-family:var(--f-num);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .k{font-size:12.5px;color:var(--text-2);font-weight:600}
.fquote{padding:16px 18px;border-radius:18px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:18px;line-height:1.3;text-align:center;text-wrap:balance}

/* ---------- progress / photos ---------- */
.player{position:relative;border-radius:20px;overflow:hidden;background:#000;aspect-ratio:4/5;max-width:100%}
.player img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.player .ov{position:absolute;left:0;right:0;bottom:0;padding:34px 14px 12px;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff;display:flex;justify-content:space-between;align-items:flex-end;font-weight:700}
.player .ov .d{font-size:17px}.player .ov .w{font-family:var(--f-num);font-size:15px;opacity:.9}
.player .cnt{position:absolute;top:10px;right:10px;padding:3px 9px;border-radius:99px;background:rgba(0,0,0,.5);color:#fff;font-size:12px;font-weight:700}
input[type=range]{width:100%;accent-color:var(--accent);height:30px}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.pgrid button{aspect-ratio:3/4;border-radius:8px;overflow:hidden;background:var(--surface-2);position:relative}
.pgrid img{width:100%;height:100%;object-fit:cover}
.pgrid .fv{position:absolute;top:4px;right:4px;color:#FFD23F;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:4px;border-radius:18px;overflow:hidden;touch-action:none}
.cmp .pane{position:relative;aspect-ratio:3/4;overflow:hidden;background:#000}
.cmp .pane img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:center}
.cmp .pane .lb{position:absolute;left:8px;bottom:8px;padding:3px 8px;border-radius:8px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;font-weight:700}
.overlay-cmp{position:relative;aspect-ratio:3/4;border-radius:18px;overflow:hidden;background:#000;touch-action:none}
.overlay-cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.overlay-cmp .top{clip-path:inset(0 0 0 50%)}
.overlay-cmp .handle{position:absolute;top:0;bottom:0;width:2px;background:#fff;left:50%;box-shadow:0 0 8px rgba(0,0,0,.5)}
.overlay-cmp .handle::after{content:"";position:absolute;top:50%;left:50%;width:34px;height:34px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 2px 8px rgba(0,0,0,.4)}
.chart{width:100%;display:block;overflow:visible}
.chart text{fill:var(--text-3);font-size:11px;font-family:var(--f-ui)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .ln2{fill:none;stroke:var(--text-2);stroke-width:2;stroke-dasharray:4 4}
.chart .ar{fill:var(--accent-soft);stroke:none}
.chart .pt{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .bar{fill:var(--accent)}
.chart .bar.prev{fill:var(--surface-3)}
.chart .hit{fill:transparent}
.chart .tip rect{fill:var(--text)}
.chart .tip text{fill:var(--bg);font-weight:700;font-size:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:11px;font-weight:700;color:var(--text-3);padding:4px 0}
.cal .d{aspect-ratio:1;display:grid;place-items:center;border-radius:12px;font-family:var(--f-num);font-weight:700;font-size:15px;color:var(--text-2);position:relative}
.cal .d.on{background:var(--accent-bg);color:var(--accent-ink)}
.cal .d.plan::after{content:"";position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--text-3)}
.cal .d.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .d.pause{background:var(--surface-2);color:var(--text-3)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:11px;height:11px;border-radius:3px;background:var(--surface-3)}
.heat i.l1{background:color-mix(in srgb,var(--accent) 45%,var(--surface-3))}
.heat i.l2{background:var(--accent)}
.bigval{font-family:var(--f-num);font-weight:800;font-size:34px;letter-spacing:-.01em;line-height:1}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kv > div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.kv .v{font-family:var(--f-num);font-weight:800;font-size:20px}
.kv .k{font-size:12px;color:var(--text-2);font-weight:600}
.bar-h{height:8px;border-radius:9px;background:var(--surface-3);overflow:hidden}
.bar-h i{display:block;height:100%;background:var(--accent);border-radius:9px}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
table.tbl th,table.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left}
table.tbl th{font-size:12px;color:var(--text-2);font-weight:700}
table.tbl td.n{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:700}

/* ---------- camera ---------- */
.cam{position:fixed;inset:0;z-index:95;background:#000;color:#fff;display:flex;flex-direction:column}
.cam .view{position:relative;flex:1;overflow:hidden}
.cam video,.cam .ghost{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam video.mirror{transform:scaleX(-1)}
.cam .ghost{pointer-events:none}
.cam .count{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-num);font-size:140px;font-weight:800;text-shadow:0 4px 30px rgba(0,0,0,.5)}
.cam .ctop{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(rgba(0,0,0,.5),transparent)}
.cam .cbot{padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;flex-direction:column;gap:12px;background:#000}
.cam .shutter{width:76px;height:76px;border-radius:50%;border:4px solid #fff;display:grid;place-items:center}
.cam .shutter i{width:60px;height:60px;border-radius:50%;background:#fff;display:block}
.cam .cbtn{color:#fff;min-width:56px;min-height:44px;font-weight:700;display:grid;place-items:center;border-radius:12px}
.cam .chips .chip{background:rgba(255,255,255,.12);color:#fff;border-color:transparent}
.cam .chips .chip[aria-pressed="true"]{background:#fff;color:#000}

/* ---------- lock ---------- */
.lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:24px}
.lock .dots{display:flex;gap:16px}
.lock .dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--text-2)}
.lock .dots i.on{background:var(--text);border-color:var(--text)}
.lock .pad{display:grid;grid-template-columns:repeat(3,76px);gap:16px}
.lock .pad button{width:76px;height:76px;border-radius:50%;background:var(--surface-2);font-family:var(--f-num);font-size:30px;font-weight:600}
.lock .pad button:active{background:var(--surface-3)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-10px)}50%{transform:translateX(10px)}75%{transform:translateX(-6px)}}

.plates{display:flex;align-items:center;gap:3px;justify-content:center;min-height:120px;padding:10px 0}
.plates .bar{width:60px;height:12px;border-radius:3px;background:var(--text-3)}
.plates .pl{border-radius:4px;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:800;writing-mode:vertical-rl}
.launch{position:fixed;inset:0;z-index:200;background:#0A0C0F;display:grid;place-items:center;transition:opacity .25s ease}
.launch.off{opacity:0;pointer-events:none}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

.setrow .no small{font-size:9.5px;font-weight:700;color:var(--text-3);letter-spacing:-.01em}
.target{margin-top:6px;font-weight:700;font-size:14px;color:var(--text)}
button.term{display:inline;padding:0 1px;font:inherit;color:var(--accent);text-decoration:underline dotted;text-underline-offset:3px;font-weight:inherit}
.guide p.gp,p.gp{margin:0;font-size:calc(16px*var(--fs));line-height:1.55;color:var(--text)}
h3.gh{margin:8px 0 -4px;font-size:18px;font-weight:800}
ul.gl{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;line-height:1.5}
.tblwrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
table.tbl.g{min-width:520px;background:var(--surface);border-radius:14px;overflow:hidden;border:1px solid var(--line);font-size:13.5px;line-height:1.4}
table.tbl.g td,table.tbl.g th{vertical-align:top;padding:9px 10px}
table.tbl.g th{background:var(--surface-2)}
table.tbl.g tr.hl td{background:var(--accent-soft);font-weight:600}
mark{background:var(--accent-soft);color:var(--text);border-radius:3px;padding:0 2px}
.anim{position:relative;border-radius:16px;overflow:hidden;background:#fff;aspect-ratio:auto}
.anim img{display:block;width:100%}
.anim img.f2{position:absolute;inset:0;animation:frame2 1.6s steps(1) infinite}
@keyframes frame2{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
.anim .tag{position:absolute;left:8px;bottom:8px;padding:3px 8px;border-radius:8px;background:rgba(0,0,0,.6);color:#fff;font-size:11.5px;font-weight:700}
details.blk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
details.blk summary{list-style:none;padding:14px 16px;font-weight:700;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
details.blk summary::-webkit-details-marker{display:none}
details.blk[open] summary{border-bottom:1px solid var(--line)}
.wkchips{display:flex;gap:6px;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.wkchips::-webkit-scrollbar{display:none}

.inp,.mini{min-width:0}
input[type=date].inp{min-width:0;display:block}
.grid2 > *,.grid3 > *{min-width:0}

/* ---------- v2: allenamento guidato ---------- */
.tchip{display:inline-flex;align-items:center;gap:3px;height:30px;padding:0 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--text-2);flex:none}
.tchip:active{background:var(--surface-2)}
.secthdr{display:flex;align-items:baseline;justify-content:space-between;margin:8px 0 -8px}
.secthdr h2.sec{margin:0}
.exblock.cur{box-shadow:0 0 0 2px var(--accent),var(--shadow)}
.exblock.alldone .exhead .t{color:var(--text-2)}
.exblock.warm .exhead .t{display:flex;align-items:center;gap:6px}
.wlist{display:flex;flex-direction:column;padding:0 6px 8px}
.wrow{display:flex;align-items:center;gap:6px;padding:4px 4px;border-radius:12px}
.wrow + .wrow{border-top:1px solid var(--line)}
.wrow.cur{background:var(--accent-soft)}
.wck{width:36px;height:36px;flex:none;border-radius:50%;display:grid;place-items:center;border:2px solid var(--text-3);color:transparent}
.wrow.done .wck{background:var(--good);border-color:var(--good);color:#fff}
.wrow.done .wname .t{text-decoration:line-through;color:var(--text-2)}
.wname{text-align:left;padding:6px 2px;font-size:15px;line-height:1.3}
.wname .t{font-weight:700}
.ssbox{border-radius:calc(var(--r-lg) + 4px);background:var(--accent-soft);padding:10px;display:flex;flex-direction:column;gap:10px;border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
.ssbox.lite{padding:0;gap:0;overflow:hidden}
.ssbox.lite .sshead{padding:12px 14px}
.ssbox.lite .list{border-top:1px solid color-mix(in srgb,var(--accent) 25%,transparent)}
.sshead{padding:4px 4px 0}
.sslab{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--accent-bg);color:var(--accent-ink);font-weight:800;font-size:13px;letter-spacing:.02em}
.exlet{flex:none;min-width:34px;height:34px;padding:0 6px;border-radius:10px;background:var(--accent-bg);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:14px;margin-top:1px}
.restinfo{display:flex;align-items:center;gap:5px;margin-top:5px;font-size:13px;font-weight:700;color:var(--text-2)}
.restinfo svg.i{width:16px;height:16px;color:var(--accent)}
.kghint{padding:0 14px 8px;font-size:12.5px;color:var(--text-2)}
.kghint .link{font-size:12.5px}
.coach{display:flex;gap:8px;align-items:flex-start;margin-top:8px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--good) 12%,transparent);font-size:14px;line-height:1.4}
.coach svg.i{color:var(--good);margin-top:1px}
.coach.first{background:var(--surface-2)}
.coach.first svg.i{color:var(--accent)}
.coach .link{font-size:13px;margin-top:4px}
.setrow.on{background:var(--accent-soft)}
.extimer{display:flex;align-items:center;justify-content:space-between;margin:8px 12px 0;padding:10px 14px;border-radius:14px;background:var(--text);color:var(--bg)}
.extimer.prep{background:var(--warn);color:#1a1200}
.extimer .lb{font-weight:800;font-size:15px}
.extimer .tm{font-family:var(--f-num);font-weight:800;font-size:30px;font-variant-numeric:tabular-nums}
.rate{margin:10px 12px 0;padding:10px 12px;border-radius:14px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px}
.rate .chip{min-height:36px}
.advice{font-size:14px;line-height:1.45;padding-top:2px}
.restbar.prep{background:var(--warn);color:#1a1200}
.restbar.work{background:var(--accent-bg);color:var(--accent-ink)}
.restbar.ready{background:var(--surface);color:var(--text);border:1px solid var(--line)}
.restbar .lt{text-align:left;color:inherit;min-width:0}
.restbar .small{opacity:.8;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.restbar .nx{font-weight:800;font-size:17px}
.restbar .rb.hi{background:var(--accent-bg);color:var(--accent-ink);display:inline-flex;align-items:center;gap:4px}
.restbar.work .rb.hi{background:var(--accent-ink);color:var(--accent-bg)}
.restbar.prep .rb.hi{background:#1a1200;color:var(--warn)}
.restbar.ready .rb{background:var(--surface-2)}
.restbar.ready .rb.hi{background:var(--accent-bg);color:var(--accent-ink)}
.flash span{font-weight:700;opacity:.9;padding:0 24px;text-align:center}
.diffs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.diff{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:left}
.diff span{font-size:12px;color:var(--text-2);line-height:1.3}
.diff[aria-pressed="true"]{background:var(--accent-bg);border-color:transparent;color:var(--accent-ink)}
.diff[aria-pressed="true"] span{color:var(--accent-ink);opacity:.85}
.sugrow{display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px solid var(--line)}
.exrow .ix.let{background:var(--accent-bg);color:var(--accent-ink);width:auto;min-width:26px;padding:0 5px}
.exrest{display:flex;align-items:center;gap:5px;padding:0 16px 11px 54px;margin-top:-6px;font-size:12.5px;font-weight:600;color:var(--text-2)}
.exrest svg.i{width:15px;height:15px;color:var(--accent)}
details.warmd summary span{display:inline-flex;align-items:center;gap:6px}
.banner.bad{background:color-mix(in srgb,var(--bad) 14%,transparent)}
.banner.bad svg.i{color:var(--bad)}

/* ---------- mappa muscoli ---------- */
.bodymap{display:flex;justify-content:center;gap:18px}
.bodymap figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.bodymap figcaption{font-size:11.5px;font-weight:700;color:var(--text-3);letter-spacing:.04em;text-transform:uppercase}
.bodymap svg{display:block}
.bm-o{fill:var(--surface-3)}
.bm-head{fill:var(--surface-3);opacity:.7}
.bm-p{fill:#E5484D}
.bm-s{fill:#F5A3A6}
:root[data-theme="dark"] .bm-s{fill:#8E3B3E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bm-s{fill:#8E3B3E}}
.pill.mp{background:#E5484D;color:#fff}
.pill.ms{background:color-mix(in srgb,#E5484D 22%,transparent);color:var(--text)}

/* ---------- albero ---------- */
.treebox{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:#8EC3F0}
.treebox canvas{display:block;width:100%;aspect-ratio:10/9}
.treebadge{position:absolute;top:12px;left:12px;padding:5px 11px;border-radius:999px;font-weight:800;font-size:13px;background:rgba(255,255,255,.88);color:#12161D}
.treebadge.healthy{background:#0F7A48;color:#fff}
.treebadge.thirsty{background:#E0A100;color:#1a1400}
.treebadge.suffering{background:#B84A14;color:#fff}
.treebadge.dying,.treebadge.dead{background:#B8261F;color:#fff}
.treemsg{font-size:17px;line-height:1.35}
.treemsg.suffering,.treemsg.dying,.treemsg.dead{color:var(--bad)}
.treemsg.thirsty{color:var(--warn)}
.tbars{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:4px}
.tbars .small{display:flex;align-items:center;gap:4px}
.tbars svg.i{width:16px;height:16px}
.forest{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.ftree{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 6px 8px;text-align:center;display:flex;flex-direction:column;gap:2px}
.ftree canvas{width:100%;aspect-ratio:1;border-radius:11px;display:block}
.fintree{overflow:hidden}
.fintree canvas{display:block;width:100%;aspect-ratio:16/9}

/* ---------- discorsi ---------- */
.sprow{display:flex;gap:12px;align-items:center;padding:10px 12px;width:100%;text-align:left}
.sprow + .sprow{border-top:1px solid var(--line)}
.sprow:active{background:var(--surface-2)}
.sprow .t{font-weight:700;font-size:15px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sprow .s{font-size:12.5px;color:var(--text-2);margin-top:2px}
.spthumb{position:relative;flex:none;width:112px;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--surface-3)}
.spthumb img{width:100%;height:100%;object-fit:cover;display:block}
.spdur{position:absolute;right:4px;bottom:4px;padding:1px 5px;border-radius:5px;background:rgba(0,0,0,.75);color:#fff;font-size:11px;font-weight:700}
.sprank{display:inline-grid;place-items:center;min-width:24px;height:20px;margin-right:6px;padding:0 5px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:800;vertical-align:1px}
.spdock{position:fixed;left:10px;right:10px;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 14px);z-index:32;display:flex;gap:10px;align-items:center;padding:8px;border-radius:18px;background:#12161D;color:#F1F3F6;box-shadow:0 10px 30px rgba(0,0,0,.35);max-width:620px;margin:0 auto}
body[data-notab="1"] .spdock{bottom:calc(env(safe-area-inset-bottom,0px) + 96px)}
.spdock .spv{flex:none;width:128px;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000}
.spdock iframe{width:100%;height:100%;border:0;display:block}
.spdock .spi{flex:1;min-width:0}
.spdock .t{font-weight:700;font-size:14px}
.spdock .rb{display:inline-grid;place-items:center;min-width:38px;height:34px;border-radius:10px;background:rgba(255,255,255,.12);color:#fff}
.spdock.big{flex-direction:column;align-items:stretch}
.spdock.big .spv{width:100%}

.wcard.col{flex-direction:column;align-items:stretch;gap:12px}
.wcard .top{display:flex;gap:14px;align-items:center}
/* nei fogli lunghi gli elementi non si devono schiacciare (immagini con overflow nascosto finivano alte 0) */
.sheet .sh-b > *{flex-shrink:0}
.page > *{flex-shrink:0}
body.hasdock .page{padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 130px)}
body.hasdock .page.no-tab{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 230px)!important}
/* parole lunghissime (link, note incollate) vanno a capo invece di allargare la pagina */
#app,.sheet,.modal{overflow-wrap:anywhere}

/* tasti piccoli resi più facili da toccare (almeno 28 px) */
.link{display:inline-flex;align-items:center;min-height:30px;padding:2px 0}
button.pill{min-height:30px;padding:4px 11px}
.sethdr{letter-spacing:.02em}
.sethdr span{white-space:nowrap}
</style>
</head>

o. Te lo guadagni una serie alla volta.","Se oggi molli, domani mollare ti sembrerà normale.","Sei stanco? Anche quelli che ti superano lo sono.","Hai detto che saresti cambiato. Quante volte l'hai già detto?","Lo specchio non mente. I numeri nemmeno. Oggi cambiali.","Chi ti ha detto che non vali niente aspetta solo che tu gli dia ragione.","Nessuno ricorda chi ci ha quasi provato.","Non sei speciale. Sei uno che deve lavorare più degli altri.","Ti ricordi quando ti sei sentito piccolo? Entra con quella faccia.","La fatica di oggi passa. La vergogna di aver mollato resta.","Quelli che ridevano di te non si allenano. Tu sì.","Vuoi che ti scelgano? Diventa impossibile da ignorare.","Nessuno ti applaude adesso. Va bene così. Lavora.","Hai già perso abbastanza tempo.","Il fisico che vuoi non arriva pensandoci.","Ogni serie saltata è un punto regalato a chi ti ha sottovalutato.","Non sei qui per stare bene. Sei qui per diventare migliore.","Se fosse facile lo farebbero tutti, e tu saresti uno dei tanti.","Ti senti debole? Bene. Adesso sai cosa allenare.","Ha scelto qualcuno che credeva più forte di te. Fallo ricredere.","Smetti di aspettare il momento giusto. Il momento è questa serie.","Nessuno si è mai pentito di essersi allenato. Di aver mollato sì.","Oggi decidi se essere quello che parla o quello che fa.","La voglia se ne va sempre. La disciplina resta solo se la usi.","Ti hanno detto che non sei portato. Allenati finché lo diventi.","Restare nella media è una scelta. Oggi non farla.","Hai paura di fallire? Fallisci una ripetizione, non una giornata.","Il tuo avversario non sa nemmeno che esisti. Fai in modo che lo scopra.","Nessuno ti regalerà niente. Prenditelo.","Pensa a chi ti ha detto che non ce l'avresti fatta. Adesso tira.","Non sei stanco. Sei abituato a fermarti.","La tua versione migliore non ti aspetterà per sempre.","Ogni volta che rimandi, qualcun altro ti passa davanti.","Il ferro non fa sconti. Non farne neanche tu.","Ti sei promesso di cambiare. Mantieni la parola almeno con te stesso.","Vali quanto il lavoro che fai quando nessuno guarda.","Se ti basta così, non stai puntando abbastanza in alto.","Hai già perso qualcosa per essere stato debole. Non deve succedere più.","Chi ti sottovaluta ti fa un favore: ti dà un motivo.","Entra, fai il lavoro, esci migliore. Il resto sono chiacchiere."],end:["Fatto. Non montarti la testa: domani si riparte da zero.","Oggi hai fatto il minimo che dovevi a te stesso.","Bene. Ripetilo altre cento volte e forse se ne accorgeranno.","Chi ha scelto un altro non sa cosa si sta perdendo. Continua così.","Una seduta non cambia niente. Cento sì.","Nessuno ti ha visto. Il risultato invece lo vedranno tutti.","Hai fatto il tuo dovere. Non aspettarti medaglie.","Oggi eri più forte di ieri. Domani devi esserlo di più.","Sei ancora lontano, ma più vicino di chi è rimasto a casa.","Ti sottovalutavano. Hanno appena perso un altro punto.","Non abbastanza per festeggiare. Abbastanza per continuare.","Ricordati questa fatica quando avrai voglia di saltare la prossima.","Il lavoro di oggi non conta niente se domani molli.","Hai pagato oggi. Il conto lo incassi tra qualche mese.","Chi diceva che non ce l'avresti fatta adesso ha un argomento in meno.","Ora mangia, dormi e torna a dimostrarlo.","La tua scusa preferita oggi ha perso.","Non sei ancora quello che vuoi essere. Ma oggi non sei tornato indietro.","Nessun applauso. Solo un'altra seduta messa da parte.","Quelli che ridevano di te oggi non si sono allenati.","Hai finito. Il te pigro è rimasto fuori dalla porta.","Un giorno ti volterai e questa sarà una delle sedute che hanno contato.","Non hai vinto niente. Hai solo smesso di perdere.","La costanza non fa rumore. Fa risultati.","Domani ti faranno male le gambe. Vuol dire che hai lavorato.","Hai mantenuto la parola. Non sono in molti a farlo.","Questa seduta nessuno te la può togliere.","Ti senti svuotato? È il prezzo, e l'hai pagato.","Hai dimostrato qualcosa a una persona sola. La più impo
