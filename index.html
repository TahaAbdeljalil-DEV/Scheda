      ${it.label ? `<div class="target">${linkTerms(it.label)}</div>` : ''}
      ${pcts.length ? `<div class="prev">${one ? `Massimale ${fmtNum(one)} kg${it.pctOf && it.pctOf !== it.exId ? ' (' + esc(exName(it.pctOf)) + ')' : ''}: ${pcts.map(p => `${p}% = ${fmtNum(pctKg(it.pctOf || it.exId, p))} kg`).join(' · ')}` : '<span style="color:var(--warn)">Manca il massimale: fai il test o inseriscilo in Guida › Massimali.</span>'}</div>` : ''}
      ${it.wnote ? `<div class="prev" style="color:var(--accent);font-weight:600">${linkTerms(it.wnote)}</div>` : ''}
      ${it.note ? `<div class="prev" style="color:var(--text)">${linkTerms(it.note)}</div>` : ''}
      ${it.test ? `<div class="pill warn" style="margin-top:6px">${icon('flask', 'sm')}Test: il risultato si registra da solo</div>` : ''}
      ${sug ? `<button class="sugg" data-a="applySug" data-i="${i}" data-v="${sug}">${icon('up', 'sm')}Prova ${fmtNum(sug)} kg</button>` : ''}
    </div><button class="iconbtn" data-a="itemMenu" data-i="${i}" aria-label="Opzioni esercizio">${icon('more')}</button></div>
    <div class="sethdr" ${two ? 'style="grid-template-columns:36px minmax(0,1fr) 52px"' : ''}><span>Serie</span><span>${c2}</span>${two ? '' : `<span>${c3}</span>`}<span></span></div>`;
  let n = 0;
  it.sets.forEach((st, j) => {
    if (st.type !== 'W') n++;
    const ph = placeholderFor(s, it, j);
    const lbl = st.type === 'W' ? 'R' : st.type === 'N' ? n : SET_LABEL[st.type] + n;
    const rirs = [...new Set(it.sets.map(x => x.t?.rir).filter(Boolean))];
    const sub = pcts.length > 1 && st.t?.pct ? st.t.pct + '%' : (rirs.length > 1 && st.t?.rir ? 'RIR ' + st.t.rir : '');
    const gcols = two ? 'style="grid-template-columns:36px minmax(0,1fr) 52px"' : '';
    let c2h, c3h = '';
    if (kind === 'time') c2h = cell(i, j, 'sec', st.sec != null ? secInput(st.sec) : '', ph.sec != null ? secInput(ph.sec) : '0:45', 'text', false, `<button class="st" data-a="workTimer" data-i="${i}" data-j="${j}" aria-label="Avvia timer">${icon('play', 'sm')}</button>`);
    else if (kind === 'distance' || kind === 'measure') c2h = cell(i, j, 'km', fmtNum(st.km), fmtNum(ph.km) || '—', 'decimal', false);
    else if (kind === 'body') c2h = cell(i, j, 'reps', st.reps ?? '', ph.repsHint || (ph.reps ?? '—'), 'numeric', true);
    else {
      c2h = cell(i, j, 'kg', fmtNum(st.kg), ph.kg != null ? fmtNum(ph.kg) : '—', 'decimal', true);
      c3h = it.unilateral
        ? `<div class="cell"><input data-in="sv" data-i="${i}" data-j="${j}" data-f="reps" inputmode="numeric" value="${st.reps ?? ''}" placeholder="${ph.repsHint || (ph.reps ?? 'Dx')}" aria-label="Ripetizioni destra"><span class="faint">/</span><input data-in="sv" data-i="${i}" data-j="${j}" data-f="reps2" inputmode="numeric" value="${st.reps2 ?? ''}" placeholder="${ph.repsHint || (ph.reps2 ?? 'Sx')}" aria-label="Ripetizioni sinistra"></div>`
        : cell(i, j, 'reps', st.reps ?? '', ph.repsHint || (ph.reps ?? '—'), 'numeric', true);
    }

      <button class="no ${st.type}" data-a="setMenu" data-i="${i}" data-j="${j}" aria-label="Serie ${lbl}: opzioni">${lbl}${sub ? `<small>${sub}</small>` : ''}</button>
      ${c2h}${two ? '' : c3h}
      <button class="ck" data-a="setDone" data-i="${i}" data-j="${j}" aria-label="${st.done ? 'Segna da fare' : 'Completa serie'}">${icon('check')}</button>
      ${st.note ? `<div class="snote">${esc(st.note)}</div>` : ''}</div>`;
  });
  h += `<div class="exfoot"><button class="btn sm" data-a="sessSetAdd" data-i="${i}">${icon('plus', 'sm')}Serie</button>
    ${kind === 'weight' ? `<button class="btn sm" data-a="plates" data-i="${i}">Dischi</button>` : ''}
    <span class="small faint" style="margin-left:auto;align-self:center">Rec. ${fmtSec(it.rest)}</span></div></section>`;
  return h;
}
function cell(i, j, f, val, ph, mode, steppers, extra = '') {
  const inp = `<input data-in="sv" data-i="${i}" data-j="${j}" data-f="${f}" inputmode="${mode}" value="${esc(val)}" placeholder="${esc(ph)}" aria-label="${f}" autocomplete="off">`;
  if (!steppers) return `<div class="cell">${inp}${extra}</div>`;
  return `<div class="cell"><button class="st" data-a="step" data-i="${i}" data-j="${j}" data-f="${f}" data-d="-1" aria-label="Meno">−</button>${inp}<button class="st" data-a="step" data-i="${i}" data-j="${j}" data-f="${f}" data-d="1" aria-label="Più">+</button></div>`;
}

const sess = () => activeSession();
function sessSave() { save(); }
IN.sv = (el) => {

  const f = el.dataset.f;

};
IN.sessNote = (el) => { const s = sess(); if (s) { s.note = el.value; sessSave(); } };

A.step = (el) => {
  const s = sess(); const i = +el.dataset.i, j = +el.dataset.j, f = el.dataset.f, d = +el.dataset.d;
  const it = s.items[i]; const st = it.sets[j];
  const ph = placeholderFor(s, it, j);
  if (f === 'kg') {
    const inc = S.settings.increment || 2.5;
    let v = st.kg ?? ph.kg ?? 0;
    v = roundKg(v + d * inc);
    if (it.kind === 'weight') v = Math.max(0, v);
    st.kg = v;
  } else {
    let v = st[f] ?? ph[f] ?? (ph.repsHint ? parseInt(ph.repsHint, 10) : 0);
    st[f] = Math.max(0, (v || 0) + d);
  }
  const inp = el.parentElement.querySelector('input');
  if (inp) inp.value = f === 'kg' ? fmtNum(st.kg) : st[f];
  sessSave();
};

A.setDone = (el) => {
  const s = sess(); const i = +el.dataset.i, j = +el.dataset.j;
  const it = s.items[i]; const st = it.sets[j];
  if (st.done) { st.done = false; delete st.doneAt; s.prs = (s.prs || []).filter(p => !(p.i === i && p.j === j)); sessSave(); rerender(); return; }
  completeSet(s, i, j);
};
function completeSet(s, i, j) {
  const it = s.items[i]; const st = it.sets[j];
  const ph = placeholderFor(s, it, j);
  const k = it.kind;
  if (k === 'weight' || k === 'assisted') { if (st.kg == null && ph.kg != null) st.kg = ph.kg; }
  if (k === 'weight' || k === 'assisted' || k === 'body') {
    if (st.reps == null) st.reps = ph.reps ?? (ph.repsHint ? parseInt(ph.repsHint.split('-')[1], 10) : null);
    if (it.unilateral && st.reps2 == null) st.reps2 = ph.reps2 ?? st.reps;
    if (st.reps == null) { toast('Scrivi le ripetizioni fatte'); return; }
  }
  if (k === 'time' && st.sec == null) st.sec = ph.sec;
  if ((k === 'distance' || k === 'measure') && st.km == null) st.km = ph.km;
  if (k === 'measure' && st.km == null) { toast('Scrivi il valore misurato'); return; }
  st.done = true; st.doneAt = Date.now();
  checkPR(s, i, j);
  sessSave();
  // recupero: niente pausa se il prossimo esercizio è in superserie
  const allDone = s.items.every(x => x.sets.every(y => y.done));
  const nextLinked = s.items[i + 1]?.link && s.items[i + 1].sets.some(y => !y.done);
  if (allDone) { s.rest = null; toast('Ultima serie fatta. Premi Termina quando vuoi.'); }
  else if (!nextLinked) startRest(it.rest || S.settings.defaultRest);
  rerender();
}
function checkPR(s, i, j) {
  const it = s.items[i]; const st = it.sets[j];
  if (st.type === 'W') return;
  const r = recordsFor(it.exId, s.id);
  // include le serie già fatte oggi, così non scatta un record a ogni serie
  const today = it.sets.filter((x, jj) => x.done && jj !== j);
  const b0 = bestOf(today, it.kind); for (const kk in r) r[kk] = Math.max(r[kk], b0[kk]);
  const b = bestOf([st], it.kind);
  const hasHist = historyFor(it.exId, s.id).length > 0;
  if (!hasHist) return;
  let msg = null, rec = null;
  if (it.kind === 'weight') {
    if (b.kg > r.kg) { msg = `Record di carico: ${it.name} ${fmtNum(b.kg)} kg`; rec = { type: 'kg', value: b.kg }; }
    else if (b.e1rm > r.e1rm + 0.05) { msg = `Record stimato (1RM): ${it.name} ${fmtNum(roundKg(b.e1rm))} kg`; rec = { type: 'e1rm', value: b.e1rm }; }
  } else if (it.kind === 'assisted') { if (b.kg > r.kg) { msg = `Record: ${it.name} ${fmtNum(b.kg)} kg`; rec = { type: 'kg', value: b.kg }; } else if (b.reps > r.reps) { msg = `Record di ripetizioni: ${it.name} ${b.reps}`; rec = { type: 'reps', value: b.reps }; } }
  else if (it.kind === 'body') { if (b.reps > r.reps) { msg = `Record di ripetizioni: ${it.name} ${b.reps}`; rec = { type: 'reps', value: b.reps }; } }
  else if (it.kind === 'time') { if (b.sec > r.sec) { msg = `Record di tempo: ${it.name} ${fmtSec(b.sec)}`; rec = { type: 'sec', value: b.sec }; } }
  else if (it.kind === 'distance') { if (b.km > r.km) { msg = `Record di distanza: ${it.name} ${fmtNum(b.km)} km`; rec = { type: 'km', value: b.km }; } }
  if (msg) {
    s.prs = (s.prs || []).filter(p => !(p.i === i && p.j === j));
    s.prs.push(Object.assign({ i, j, exId: it.exId, name: it.name }, rec));
    setTimeout(() => toast(msg, { pr: true, ms: 3500 }), 150);
  }
}

A.itemMenu = async (el) => {
  const s = sess(); const i = +el.dataset.i; const it = s.items[i]; const ex = exById(it.exId);

A.sessMin = () => { Wake.off(); NAV.stack = []; NAV.tab = 'today'; render({ restore: true }); };

/* ---- swipe sulle serie: destra = completa, sinistra = elimina ---- */
function attachSwipe(row) {
  let x0 = null, y0 = 0, dx = 0, lockDir = null;
  row.addEventListener('touchstart', e => { if (e.target.closest('input')) return; x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = 0; lockDir = null; }, { passive: true });
  row.addEventListener('touchmove', e => {
    if (x0 === null) return;
    const t = e.touches[0]; dx = t.clientX - x0; const dy = t.clientY - y0;
    if (!lockDir) { if (Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) * 1.4) lockDir = 'h'; else if (Math.abs(dy) > 10) lockDir = 'v'; }
    if (lockDir !== 'h') return;
    row.style.transform = `translateX(${clamp(dx, -120, 120)}px)`;
    row.style.background = dx > 0 ? 'color-mix(in srgb,var(--good) 22%,var(--surface))' : 'color-mix(in srgb,var(--bad) 18%,var(--surface))';
  }, { passive: true });

}

/* ---- timer: recupero e serie a tempo (basati sull'orario, restano giusti a schermo bloccato) ---- */
function startRest(sec) {

}
A.workTimer = (el) => {
  const s = sess(); const it = s.items[+el.dataset.i]; const st = it.sets[+el.dataset.j];
  const ph = placeholderFor(s, it, +el.dataset.j);
  const sec = st.sec ?? ph.sec ?? 45;
  Sound.unlock();
  s.rest = { endAt: Date.now() + sec * 1000 + 3000, total: sec, kind: 'work', i: +el.dataset.i, j: +el.dataset.j, startAt: Date.now() + 3000 };

};
A.restAdj = (el) => { const s = sess(); if (!s?.rest) return; s.rest.endAt += (+el.dataset.d) * 1000; s.rest.total = Math.max(1, s.rest.total + (+el.dataset.d)); sessSave(); tickSession(); };
A.restSkip = () => { const s = sess(); if (!s) return; s.rest = null; sessSave(); tickSession(); };
let lastCountBeep = 0;
function tickSession() {
  const s = sess();
  const clock = $('#sess-clock');
  if (!s || !clock) { clearInterval(VIEWS.session._t); return; }
  clock.textContent = fmtDur(Date.now() - s.startedAt);
  const slot = $('#restbar-slot'); if (!slot) return;
  const r = s.rest;
  if (!r) { slot.innerHTML = ''; return; }
  const now = Date.now();
  const left = r.endAt - now;
  if (r.kind === 'work' && now < r.startAt) {
    const c = Math.ceil((r.startAt - now) / 1000);
    if (c !== lastCountBeep) { lastCountBeep = c; Sound.beep(1, 660); }
    slot.innerHTML = `<div class="restbar"><div class="grow"><div class="small" style="opacity:.7;font-weight:700">Pronto</div><div class="tm">${c}</div></div><button class="rb" data-a="restSkip">Annulla</button></div>`;
    return;
  }
  if (left <= 0) {
    const wasWork = r.kind === 'work';
    s.rest = null;
    if (wasWork) { const st = s.items[r.i]?.sets[r.j]; if (st) { st.sec = r.total; } }
    sessSave();
    slot.innerHTML = '';
    // avviso solo se il timer è scaduto da poco (non se riapri l'app dopo un'ora)
    if (left > -15000) {
      Sound.beep(3);
      const f = document.createElement('div'); f.className = 'flash';
      f.innerHTML = `${icon(wasWork ? 'check' : 'bolt', 'lg')}<b>${wasWork ? 'Tempo!' : 'Recupero finito'}</b><span>${wasWork ? 'Serie completata' : 'Prossima serie'}</span>`;
      document.body.append(f); setTimeout(() => f.remove(), 1900);
    }
    if (wasWork) completeSet(s, r.i, r.j); else rerender();
    return;
  }
  const pct = clamp(left / (r.total * 1000), 0, 1) * 100;
  const lbl = r.kind === 'work' ? 'Serie in corso' : 'Recupero';
  const html = `<div class="restbar" role="timer"><div class="grow"><div class="small" style="opacity:.7;font-weight:700">${lbl}</div><div class="tm">${fmtDur(left + 999)}</div></div>
    ${r.kind === 'rest' ? `<button class="rb" data-a="restAdj" data-d="-15">−15</button><button class="rb" data-a="restAdj" data-d="15">+15</button>` : ''}<button class="rb" data-a="restSkip">${r.kind === 'rest' ? 'Salta' : 'Stop'}</button>
    <div class="ring"><i style="width:${pct}%"></i></div></div>`;
  const tm = slot.querySelector('.tm');
  if (tm && slot.querySelector('.small')?.textContent === lbl) { tm.textContent = fmtDur(left + 999); slot.querySelector('.ring i').style.width = pct + '%'; }
  else slot.innerHTML = html;
}

/* ---- calcolatore dischi ---- */
function platesFor(total) {
  const bar = S.settings.barKg || 20;
  let side = (total - bar) / 2;
  const plates = (S.settings.plates || []).slice().sort((a, b) => b - a);
  const out = [];
  if (side < 0) return { out, rest: side * 2, bar };
  for (const p of plates) { while (side >= p - 1e-9) { out.push(p); side = Math.round((side - p) * 1000) / 1000; } }
  return { out, rest: side * 2, bar };
}
function platesHtml(total) {
  const r = platesFor(total);
  if (total < r.bar) return `<div class="muted small">Il carico è inferiore al bilanciere (${fmtNum(r.bar)} kg).</div>`;
  const h = p => 40 + Math.min(80, p * 3.2);
  return `<div class="plates" aria-label="Dischi per lato"><div class="bar"></div>${r.out.map(p => `<div class="pl" style="height:${h(p)}px;width:${p >= 10 ? 22 : 16}px;background:${PLATE_COLORS[p] || '#9AA1AC'};color:${p === 5 ? '#12161D' : '#fff'}">${fmtNum(p)}</div>`).join('')}</div>
    <div style="text-align:center"><b>Per lato:</b> ${r.out.length ? r.out.map(fmtNum).join(' + ') + ' kg' : 'nessun disco'}</div>
    ${r.rest > 0.01 ? `<div class="small" style="text-align:center;color:var(--warn)">Mancano ${fmtNum(r.rest)} kg: con i dischi disponibili non si arriva esatti.</div>` : ''}
    <div class="tiny faint" style="text-align:center">Bilanciere ${fmtNum(r.bar)} kg · modificabile nelle impostazioni</div>`;
}

A.plates = (el) => {

async function finishSession(s) {

/* ================= BACKUP e FINE ALLENAMENTO ================= */
const BACKUP_AUTO_NAME = 'Scheda-backup.zip';
function stateJSON() { return JSON.stringify(S, (k, v) => k && k[0] === '_' ? undefined : v); }

async function buildBackup(full, onProgress) {
  const files = [];
  const index = {};
  let keys = [];
  if (full) keys = await DB.blobKeys();
  const blobs = [];
  for (const k of keys) {
    const rec = await DB.blobGet(k); if (!rec) continue;
    const b = rec.blob || rec; index[k] = rec.type || b.type || 'application/octet-stream';
    blobs.push({ name: 'blobs/' + k, blob: b });
  }
  const payload = { app: 'Scheda', format: 1, version: APP_VERSION, created: Date.now(), full: !!full, blobs: index, state: JSON.parse(stateJSON()), guide: G.guide && G.guide.length ? G : null };
  files.push({ name: 'data.json', blob: new Blob([JSON.stringify(payload)], { type: 'application/json' }) });
  files.push(...blobs);
  const zip = await Zip.write(files, onProgress);
  return zip;
}
function backupName(full, auto) {
  if (auto) return BACKUP_AUTO_NAME;
  const d = new Date();
  return `Scheda-${full ? 'completo' : 'dati'}-${dkey(d)}-${pad2(d.getHours())}${pad2(d.getMinutes())}.zip`;
}
// apre il menu Condividi di iOS ("Salva su File"). Deve partire da un tocco.
async function shareFile(blob, name, mime = 'application/zip') {
  const file = new File([blob], name, { type: mime });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file] });
      return 'shared';
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return 'cancel';
    console.warn(e);
  }
  // alternativa: download classico (computer o browser senza Condividi)
  try {
    const u = URL.createObjectURL(file);
    const a = document.createElement('a'); a.href = u; a.download = name; document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 60000);
    return 'downloaded';
  } catch (e) { return 'error'; }
}
function markBackup(size) { S.meta.lastBackup = Date.now(); S.meta.lastBackupSize = size; save(); }

async function restoreBackup(file) {
  let entries;
  try { entries = await Zip.read(file); } catch (e) { toast(e.message); return; }
  const dj = entries.get('data.json');
  if (!dj) { toast('Il file non contiene dati di Scheda.'); return; }
  let payload;
  try { payload = JSON.parse(await dj.text()); } catch (e) { toast('Backup danneggiato: dati illeggibili.'); return; }
  if (payload.app !== 'Scheda' || !payload.state) { toast('Questo file non è un backup di Scheda.'); return; }
  const st = payload.state;
  const n = (a) => (a || []).filter(x => !x.deletedAt).length;
  const txt = `Backup del ${fmtDate(dkey(new Date(payload.created)), { year: true })}: ${n(st.workouts)} workout, ${n(st.sessions)} sedute, ${n(st.photos)} foto.<br><br>${payload.full ? 'Sostituisce tutti i dati attuali, foto comprese.' : 'Backup senza foto: sostituisce i dati e tiene le foto e i video già presenti sul telefono.'}`;
  if (!await confirmBox({ title: 'Ripristinare questo backup?', text: txt, ok: 'Ripristina', danger: true })) return;
  const busy = document.createElement('div'); busy.className = 'modal'; busy.innerHTML = `<div class="mc"><h3>Ripristino in corso</h3><p id="rs-p">Preparazione…</p><div class="progress"><i id="rs-b" style="width:0%"></i></div></div>`;
  document.body.append(busy);
  try {
    const blobEntries = [...entries.entries()].filter(([k]) => k.startsWith('blobs/'));
    if (payload.full) await DB.clearAll();
    let i = 0;
    for (const [k, b] of blobEntries) {
      const id = k.slice(6);
      const type = payload.blobs?.[id] || 'application/octet-stream';
      const copy = new Blob([await b.arrayBuffer()], { type });
      await DB.blobPut(id, { blob: copy, type });
      i++; $('#rs-p').textContent = `File ${i} di ${blobEntries.length}`; $('#rs-b').style.width = (i / blobEntries.length * 100) + '%';
    }
    S = migrate(st);
    S.meta.lastBackup = payload.created;
    if (payload.guide) { G = Object.assign({ guide: [], terms: [], termWords: {}, targets: {} }, payload.guide); await saveGuide(); }
    await Store.now();
    BlobURL.clear();
    applyTheme();
    busy.remove();
    NAV.stack = []; NAV.tab = 'today'; render({ reset: true });
    toast('Backup ripristinato');
  } catch (e) {
    console.error(e); busy.remove();
    toast('Ripristino non riuscito: ' + e.message);
  }
}

    y += 58; if (y > H - 80) break;
  }
  g.fillStyle = acc; g.font = F(800, 34); g.fillText('SCHEDA', 80, H - 60);
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('Immagine non creata')), 'image/png'));

function roundRect(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

let G = { guide: [], terms: [], termWords: {}, targets: {} }; // contenuti della guida (salvati a parte)

async function saveGuide() { try { await DB.put('guide', JSON.stringify(G)); } catch (e) { } }

/* ---- settimana del programma di una data ---- */
function pwOf(k) { const p = programWeek(k); return p && !p.out ? p.n : null; }
function weekMonday(n) { return S.program.start ? addDays(weekStart(S.program.start), (n - 1) * 7) : null; }

/* esercizi effettivi di un workout in una certa settimana (filtro settimane + piano settimanale) */
function itemsFor(w, week) {
  const out = [];
  for (const it of w.items || []) {
    if (it.weeks && week != null && (week < it.weeks[0] || week > it.weeks[1])) continue;
    const pl = week != null && it.plan ? it.plan[String(week)] : null;
    out.push(pl ? Object.assign({}, it, { sets: pl.sets, label: pl.label || it.label, wnote: pl.note || '' }) : it);
  }
  return out;
}
function woInWeek(w, week) { return !w.pw || (week != null && week >= w.pw[0] && week <= w.pw[1]); }

/* ---- massimali ---- */
function oneRM(exId) {
  const m = S.maxes[exId];
  if (m && m.oneRM) return m.oneRM;
  const r = recordsFor(exId);
  return r.e1rm ? roundKg(r.e1rm) : null;
}
function pctKg(exId, pct) {
  const one = oneRM(exId);
  if (!one || !pct) return null;
  return Math.floor(one * pct / 100 / 2.5) * 2.5; // arrotonda ai 2,5 kg inferiori
}

/* ---- parole della guida toccabili ---- */
function linkTerms(text) {
  let s = esc(text || '');
  const words = Object.keys(G.termWords || {}).sort((a, b) => b.length - a.length);
  if (!words.length) return s;
  const re = new RegExp('(' + words.map(w => w.replace(/[.*+?^${}()|[\]\\/]/g, '\\$&')).join('|') + ')', 'g');
  const used = new Set();
  return s.replace(re, (m) => { const k = G.termWords[m]; if (!k || used.has(k)) return m; used.add(k); return `<button class="term" data-a="term" data-k="${k}">${m}</button>`; });
}

function openTerm(k) {
  const t = (G.terms || []).find(x => x.k === k);
  if (!t) return;
  openSheet({ title: t.title, body: `<div style="font-size:17px;line-height:1.5">${esc(t.text)}</div><button class="btn block" data-a="guideSearchTerm" data-k="${k}">${icon('note', 'sm')}Apri la guida</button>` });
}

/* ---- risultati dei test a fine seduta ---- */
function processTests(s) {
  const out = [];
  for (const it of s.items || []) {
    if (!it.test) continue;
    const done = it.sets.filter(x => x.done && x.type !== 'W');
    if (!done.length) continue;
    let value = null;
    if (it.test.rm) {
      const ok = done.filter(x => x.kg != null && (x.reps || 0) >= it.test.rm);
      if (ok.length) value = Math.max(...ok.map(x => x.kg));
    } else if (it.kind === 'measure' || it.kind === 'distance') value = Math.max(...done.map(x => x.km || 0)) || null;
    else value = Math.max(...done.map(x => Math.max(x.reps || 0, x.reps2 || 0))) || null;
    if (value == null) continue;
    const week = s.pw || pwOf(s.date);
    S.tests = S.tests.filter(t => !(t.auto && t.sessionId === s.id && t.name === it.test.name));
    S.tests.push({ id: uid(), name: it.test.name, value, unit: it.test.unit || '', week, date: s.date, note: '', auto: true, sessionId: s.id });
    if (it.test.rm) {
      const factor = it.test.rm === 5 ? 1.16 : it.test.rm === 3 ? 1.09 : (1 + it.test.rm / 30);
      S.maxes[it.exId] = { oneRM: roundKg(value * factor), value, rm: it.test.rm, date: s.date, src: 'test' };
    }
    out.push({ name: it.test.name, value, unit: it.test.unit, exId: it.exId });
    autoGoal(it, value);
  }
  return out;
}
function autoGoal(it, value) {
  const add = (S.program.autoGoals || {})[it.progKey];
  if (!add) return;
  const end = S.program.start ? addDays(weekMonday(S.program.weeks), 6) : '';
  if (it.test.rm) {
    if (S.goals.some(g => g.exId === it.exId && g.metric === 'e1rm')) return;
    const one = S.maxes[it.exId]?.oneRM; if (!one) return;
    S.goals.push({ id: uid(), exId: it.exId, metric: 'e1rm', target: roundKg(one + add * 1.09), deadline: end, auto: true });
  } else if (it.kind === 'measure') {
    if (S.goals.some(g => g.exId === it.exId)) return;
    S.goals.push({ id: uid(), exId: it.exId, metric: 'val', target: value + add, deadline: end, auto: true });
  }
}

async function importProgram() {
  const busy = document.createElement('div'); busy.className = 'modal';
  busy.innerHTML = `<div class="mc"><h3>Carico il programma</h3><p id="ip-p">Scarico le schede…</p><div class="progress"><i id="ip-b" style="width:0%"></i></div></div>`;
  document.body.append(busy);
  const setP = (t, p) => { const a = $('#ip-p'), b = $('#ip-b'); if (a) a.textContent = t; if (b) b.style.width = (p * 100) + '%'; };
  try {
    const res = await fetch('program/program.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error('file del programma non trovato');
    const P = await res.json();
    // esercizi: riusa quelli con lo stesso nome
    const keyToId = {};
    const media = [];
    for (const e of P.exercises) {
      let ex = live(S.exercises).find(x => x.progKey === e.key) || live(S.exercises).find(x => x.name.toLowerCase() === e.name.toLowerCase());
      if (!ex) { ex = { id: uid(), name: e.name, media: [], link: '' }; S.exercises.push(ex); }
      Object.assign(ex, { progKey: e.key, kind: e.kind, unilateral: !!e.uni, muscles: e.mus || [], note: e.note || ex.note || '', alt2: e.alt2 || '', repsUnit: e.repsUnit || null, unit: e.unit || null, group: e.group || '', approx: !!e.approx });
      if (e.db && !(ex.media || []).some(m => m.prog)) media.push({ ex, db: e.db });
      keyToId[e.key] = ex.id;
    }
    for (const e of P.exercises) { const ex = exById(keyToId[e.key]); ex.altId = e.alt ? keyToId[e.alt] || '' : (ex.altId || ''); }
    // immagini (due fotogrammi per esercizio), salvate sul telefono
    const slug = n => n.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    setP('Scarico le immagini…', 0.05);
    let pack = new Map();
    try { const mr = await fetch('program/media.zip'); if (mr.ok) pack = await Zip.read(await mr.blob()); } catch (e) { console.warn('media.zip', e); }
    const cache = {};
    let i = 0;
    for (const m of media) {
      i++; setP(`Immagini degli esercizi: ${i} di ${media.length}`, i / media.length * 0.9);
      const s = slug(m.db);
      try {
        if (true) { // un file per esercizio: eliminarne uno non tocca gli altri
          const ids = [];
          for (const f of [0, 1]) {
            const part = pack.get(`${s}-${f}.jpg`);
            if (!part) continue;
            const b = new Blob([await part.arrayBuffer()], { type: 'image/jpeg' }); const id = uid();
            await DB.blobPut(id, { blob: new Blob([b], { type: 'image/jpeg' }), type: 'image/jpeg' });
            ids.push({ id, size: b.size });
          }
          cache[s] = ids;
        }
        if (cache[s].length) m.ex.media = [{ id: cache[s][0].id, id2: cache[s][1]?.id || null, thumb: cache[s][0].id, type: 'image', anim: cache[s].length > 1, prog: true, approx: !!m.ex.approx, size: cache[s].reduce((a, x) => a + x.size, 0) }].concat((m.ex.media || []).filter(x => !x.prog));
      } catch (e) { console.warn('media', m.db, e); }
    }
    setP('Creo le schede…', 0.95);
    // workout: sostituisce quelli di un import precedente
    S.workouts = S.workouts.filter(w => w.prog !== 'v3');
    for (const w of P.workouts) {
      const days = w.day === 0 ? [1, 3, 6] : [w.day];
      S.workouts.push({
        id: uid(), prog: 'v3', title: w.title, days, pw: w.weeks, block: w.block, code: w.code, pinFirst: !!w.pinFirst, optional: w.code === 'R', note: w.note || '',
        color: w.block == null ? '#5B6472' : WCOLORS[[0, 1, 2, 3, 4, 5, 6, 0, 1][w.block] ?? 0], icon: w.code === 'R' ? '🔥' : w.code === 'A' ? '🦵' : w.code === 'B' ? '💪' : '🎯',
        items: w.items.map(it => ({
          id: uid(), exId: keyToId[it.ex], progKey: it.ex, rest: it.rest ?? 90, link: !!it.link, note: it.note || '', label: it.label || '',
          weeks: it.weeks || null, plan: it.plan || null, pctOf: it.pctOf ? keyToId[it.pctOf] : null, test: it.test || null, sets: it.sets
        }))
      });
    }
    S.dayOrder = {};
    Object.assign(S.program, { name: P.name, start: P.start, weeks: P.weeks, testWeeks: P.testWeeks, deloadWeeks: P.deloadWeeks, deloadPct: P.deloadPct, weekNotes: P.weekNotes, autoGoals: P.autoGoals, loaded: 'v3',
      blocks: P.blocks.map(b => ({ id: 'b' + b.n, n: b.n, name: b.name, from: b.from, to: b.to, focus: b.focus, plio: b.plio, note: b.note, desc: b.desc, params: b.params })) });
    for (const g of P.goals || []) {
      const exId = keyToId[g.ex];
      if (!S.goals.some(x => x.exId === exId && x.metric === g.metric)) S.goals.push({ id: uid(), exId, metric: g.metric, target: g.target, deadline: addDays(weekMonday(P.weeks), 6), auto: true });
    }
    G = { guide: P.guide, terms: P.terms, termWords: P.termWords, targets: P.targets };
    await saveGuide();
    await Store.now();
    busy.remove();
    NAV.stack = []; NAV.tab = 'today'; NAV.sel = null; render({ reset: true });
    toast('Programma caricato');
  } catch (e) {
    console.error(e); busy.remove();
    toast('Programma non caricato: ' + e.message);
  }
}

function guideSearch(q) {
  const hits = [];
  const snip = (txt) => { const i = txt.toLowerCase().indexOf(q); if (i < 0) return null; const a = Math.max(0, i - 60), b = Math.min(txt.length, i + q.length + 90); return (a ? '…' : '') + esc(txt.slice(a, i)) + '<mark>' + esc(txt.slice(i, i + q.length)) + '</mark>' + esc(txt.slice(i + q.length, b)) + (b < txt.length ? '…' : ''); };
  for (const t of G.terms) { const s = snip(t.title + ': ' + t.text); if (s) hits.push({ kind: 'term', k: t.k, title: t.title, s }); }

  for (const e of live(S.exercises).filter(e => e.progKey)) { const s = snip(e.name + ': ' + (e.note || '')); if (s) hits.push({ kind: 'ex', id: e.id, title: e.name, s }); }
  if (!hits.length) return `<div class="card empty small">Nessun risultato per "${esc(q)}".</div>`;
  return `<div class="list">${hits.slice(0, 40).map(h => `<button class="row" ${h.kind === 'term' ? `data-a="term" data-k="${h.k}"` : h.kind === 'ch' ? `data-a="go" data-view="guideChapter" data-id="${h.id}"` : `data-a="exInfo" data-id="${h.id}"`}><div class="grow"><div class="t">${esc(h.title)} <span class="pill">${h.kind === 'term' ? 'termine' : h.kind === 'ch' ? 'capitolo' : 'esercizio'}</span></div><div class="s">${h.s}</div></div></button>`).join('')}</div>`;

NAV.calM = null;
function calendarBlock() {
  const today = dkey();
  const m = NAV.calM || today.slice(0, 7);
  const [y, mo] = m.split('-').map(Number);
  const first = `${m}-01`;
  const days = new Date(y, mo, 0).getDate();
  const lead = isoDow(parseKey(first)) - 1;
  const monthSess = doneSessions().filter(s => s.date.slice(0, 7) === m).sort((a, b) => a.startedAt - b.startedAt);
  const doneSet = new Set(monthSess.map(s => s.date));
  let g = DOW_SHORT.map(d => `<div class="h">${d[0]}</div>`).join('') + '<div></div>'.repeat(lead);
  for (let d = 1; d <= days; d++) {
    const k = `${m}-${pad2(d)}`;
    const cls = [doneSet.has(k) ? 'on' : '', pauseOn(k) ? 'pause' : '', !doneSet.has(k) && k >= today && plannedFor(k).length ? 'plan' : '', k === today ? 'today' : ''].join(' ');
    g += `<button class="d ${cls}" data-a="calDay" data-k="${k}" aria-label="${fmtDate(k)}">${d}</button>`;
  }
  const totMin = monthSess.reduce((a, s) => a + ((s.endedAt || s.startedAt) - s.startedAt) / 60000, 0);
  let h = `<div class="card pad stack"><div class="hstack between"><button class="iconbtn" data-a="calMove" data-d="-1" aria-label="Mese precedente">${icon('back')}</button>
      <b style="font-size:17px">${cap(MONTHS[mo - 1])} ${y}</b><button class="iconbtn" data-a="calMove" data-d="1" aria-label="Mese successivo">${icon('chev')}</button></div>
      <div class="cal">${g}</div>
      <div class="hstack wrap small muted" style="gap:14px"><span class="hstack"><span style="width:10px;height:10px;border-radius:3px;background:var(--accent)"></span>Allenato</span><span class="hstack"><span style="width:5px;height:5px;border-radius:50%;background:var(--text-3)"></span>Previsto</span></div></div>
    <div class="kv"><div><div class="v">${monthSess.length}</div><div class="k">Sedute</div></div><div><div class="v">${fmtMin(totMin)}</div><div class="k">Tempo</div></div><div><div class="v">${fmtBig(monthSess.reduce((a, s) => a + sessionVolume(s), 0))}</div><div class="k">Kg di volume</div></div></div>`;
  if (monthSess.length) h += `<h2 class="sec">Sedute del mese</h2><div class="list">${monthSess.slice().reverse().map(s => `<button class="row" data-a="go" data-view="sessionView" data-id="${s.id}"><div class="grow"><div class="t">${esc(s.title)}</div><div class="s">${cap(fmtDate(s.date, { dow: true }))} · ${s.quick ? 'segnato come fatto' : fmtDur(s.endedAt - s.startedAt)}${s.rpe ? ' · fatica ' + s.rpe : ''}</div></div>${icon('chev', 'sm chev')}</button>`).join('')}</div>`;
  // mappa annuale
  const end = today; const start = addDays(weekStart(end), -7 * 52);
  const all = new Map(); doneSessions().forEach(s => all.set(s.date, (all.get(s.date) || 0) + 1));
  let cells = ''; for (let k = start; k <= end; k = addDays(k, 1)) { const n = all.get(k) || 0; cells += `<i class="${n > 1 ? 'l2' : n ? 'l2' : ''}" title="${fmtDate(k)}"></i>`; }
  h += `<h2 class="sec">Ultimo anno</h2><div class="card pad"><div class="heat" aria-label="Giorni allenati nell'ultimo anno">${cells}</div><div class="small muted" style="margin-top:8px">${[...all.keys()].filter(k => k >= start).length} giorni allenati in 12 mesi</div></div>`;
  return h;
}

/* ---------------- statistiche ---------------- */
function statsSeg() {
  const today = dkey(); const ws = weekStart(today);
  const cur = weekStats(ws), prev = weekStats(addDays(ws, -7));
  const prevFull = (() => { let p = 0, d = 0; for (let i = 0; i < 7; i++) { const k = addDays(ws, i - 7); p += plannedFor(k).length; d += sessionsOn(k).length; } return { planned: p, done: d }; })();
  // volume per settimana (8)
  const vb = []; for (let i = 7; i >= 0; i--) { const a = addDays(ws, -7 * i), b = addDays(a, 6); const v = doneSessions().filter(s => s.date >= a && s.date <= b).reduce((x, s) => x + sessionVolume(s), 0); vb.push({ lab: fmtDateShort(a).split(' ')[0] + '/' + (parseKey(a).getMonth() + 1), full: 'Sett. dal ' + fmtDateShort(a), v, dim: i > 0 }); }
  // ore per mese (6)
  const hb = []; const now = new Date(); for (let i = 5; i >= 0; i--) { const d = new Date(now.getFullYear(), now.getMonth() - i, 1); const mk = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`; const min = doneSessions().filter(s => s.date.slice(0, 7) === mk && !s.quick).reduce((a, s) => a + (s.endedAt - s.startedAt) / 60000, 0); hb.push({ lab: MONTHS_S[d.getMonth()], full: cap(MONTHS[d.getMonth()]), v: Math.round(min / 6) / 10, dim: i > 0 }); }
  // serie per muscolo questa settimana
  // serie dirette: conta solo il muscolo principale (il primo dell'esercizio), come nella guida
  const mus = {}; doneSessions().filter(s => s.date >= ws).forEach(s => (s.items || []).forEach(it => { const e = exById(it.exId); const n = it.sets.filter(x => x.done && x.type !== 'W').length; const m = (e?.muscles || [])[0]; if (m && n) mus[m] = (mus[m] || 0) + n; }));
  const T = G.targets || {};
  Object.keys(T).forEach(m => { if (!(m in mus)) mus[m] = 0; });
  const mx = Math.max(1, ...Object.values(mus), ...Object.values(T).map(t => t[1]));
  const bl = programWeek(); const strengthBlock = bl && bl.block && /Forza|Potenza/.test(bl.block.name);
  const vThis = vb[vb.length - 1].v, vPrev = vb[vb.length - 2].v;
  const rpes = doneSessions().filter(s => s.rpe).slice(-10);
  let h = `<div class="kv"><div><div class="v">${streakWeeks()}</div><div class="k">Settimane di fila</div></div><div><div class="v">${cur.done}/${plannedFor ? cur.planned : 0}</div><div class="k">Questa settimana</div></div><div><div class="v">${prevFull.done}/${prevFull.planned}</div><div class="k">Settimana scorsa</div></div></div>`;
  h += `<div class="card pad stack"><div class="hstack between"><b>Volume settimanale</b><span class="small ${vThis >= vPrev ? '' : 'muted'}">${vPrev ? (vThis >= vPrev ? '+' : '') + fmtNum((vThis - vPrev) / vPrev * 100, 0) + '% sulla scorsa' : ''}</span></div>${barChart(vb, { fmt: v => fmtBig(v) + ' kg', label: 'Volume settimanale' })}</div>`;
  h += `<div class="card pad stack"><b>Ore di allenamento al mese</b>${barChart(hb, { fmt: v => fmtNum(v, 1) + ' h', label: 'Ore al mese' })}</div>`;
  h += `<div class="card pad stack"><b>Serie dirette per muscolo · questa settimana</b>${Object.keys(T).length ? `<div class="tiny faint">Barra grigia: fascia consigliata dalla guida per i blocchi di ipertrofia${strengthBlock ? '. Sei in un blocco di forza o potenza: gli accessori scendono del 30-40%, quindi è normale restare sotto.' : '.'}</div>` : ''}
    ${Object.keys(mus).length ? Object.entries(mus).sort((a, b) => b[1] - a[1]).map(([m, n]) => { const t = T[m]; const st = !t ? '' : n < t[0] ? 'sotto' : n > t[1] ? 'sopra' : 'nel range'; const col = !t ? 'var(--accent)' : n < t[0] ? 'var(--warn)' : n > t[1] ? 'var(--accent)' : 'var(--good)';
      return `<div class="stack" style="gap:4px"><div class="hstack between small"><span>${m}${t ? ` <span class="faint">${t[0]}${t[1] !== t[0] ? '-' + t[1] : ''}</span>` : ''}</span><span><b class="num">${n}</b>${st ? ` <span class="pill ${n < t[0] ? 'warn' : n > t[1] ? 'acc' : 'good'}">${st}</span>` : ''}</span></div>
      <div class="bar-h" style="position:relative">${t ? `<span style="position:absolute;top:0;bottom:0;left:${t[0] / mx * 100}%;width:${Math.max(1.5, (t[1] - t[0]) / mx * 100)}%;background:var(--text-3);opacity:.45"></span>` : ''}<i style="width:${n / mx * 100}%;background:${col};position:relative"></i></div></div>`; }).join('') : '<div class="small muted">Assegna i muscoli agli esercizi nella libreria per vedere questo conteggio.</div>'}</div>`;

}

  const body = () => `<img data-blob="${p.blobId}" alt="" style="width:100%;border-radius:16px;background:#000;max-height:58vh;object-fit:contain">
    <div class="hstack between"><div><b>${cap(fmtDate(p.date, { dow: true, year: true }))}</b><div class="small muted">${p.weight ? 'Peso ' + fmtNum(p.weight, 1) + ' kg' : 'Peso non registrato'}</div></div>
      <button class="iconbtn acc" id="pv-fav" aria-label="Preferita">${icon(p.fav ? 'starf' : 'star')}</button></div>
    <div class="chips">${Object.entries(PHOTO_CATS).map(([k, l]) => `<button class="chip" data-c="${k}" aria-pressed="${p.cat === k}">${l}</button>`).join('')}</div>
    <div class="btn-row"><button class="btn sm" id="pv-date">${icon('cal', 'sm')}Cambia data</button><button class="btn sm danger" id="pv-del">${icon('trash', 'sm')}Elimina</button></div>`;
  openSheet({
    title: 'Foto', body: body(),
    onMount(el) {
      el.addEventListener('click', async e => {
        const c = e.target.closest('[data-c]');
        if (c) { p.cat = c.dataset.c; save(); $$('[data-c]', el).forEach(x => x.setAttribute('aria-pressed', x === c)); return; }
        if (e.target.closest('#pv-fav')) { p.fav = !p.fav; save(); e.target.closest('#pv-fav').innerHTML = icon(p.fav ? 'starf' : 'star'); return; }
        if (e.target.closest('#pv-date')) { const d = await dateBox({ title: 'Data della foto', value: p.date }); if (d) { p.date = d; p.weight = weightAt(d) ?? p.weight; save(); closeSheet(); rerender(); } return; }
        if (e.target.closest('#pv-del')) {
          if (!await confirmBox({ title: 'Eliminare la foto?', text: 'Finisce nel cestino per 30 giorni.', ok: 'Elimina', danger: true })) return;
          p.deletedAt = Date.now(); save(); closeSheet(); rerender();
          toast('Foto eliminata', { undo: () => { delete p.deletedAt; save(); rerender(); } });
        }
      });
    },
    onClose() { if (NAV.pseg === 'photos' && !NAV.stack.length && NAV.tab === 'progress') setTimeout(rerender, 280); }
  });
}
A.openPhoto = (el) => openPhoto(el.dataset.id);

// zoom sincronizzato con due dita
function pinchSync(container, imgs) {
  let sc = 1, tx = 0, ty = 0, start = null, lastTap = 0;
  const apply = () => imgs.forEach(i => i.style.transform = `translate(${tx}px,${ty}px) scale(${sc})`);
  const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  container.addEventListener('touchstart', e => {
    if (e.touches.length === 2) start = { d: dist(e.touches), sc, tx, ty, mode: 'pinch' };
    else if (e.touches.length === 1) {
      const now = Date.now(); if (now - lastTap < 300) { sc = 1; tx = 0; ty = 0; apply(); } lastTap = now;
      start = { x: e.touches[0].clientX, y: e.touches[0].clientY, tx, ty, mode: 'pan' };
    }
  }, { passive: true });
  container.addEventListener('touchmove', e => {
    if (!start) return;
    if (start.mode === 'pinch' && e.touches.length === 2) { sc = clamp(start.sc * dist(e.touches) / start.d, 1, 5); apply(); e.preventDefault(); }
    else if (start.mode === 'pan' && sc > 1 && e.touches.length === 1) { tx = start.tx + (e.touches[0].clientX - start.x); ty = start.ty + (e.touches[0].clientY - start.y); apply(); e.preventDefault(); }
  }, { passive: false });
  container.addEventListener('touchend', () => { start = null; });
}

/* ---- esporta la sequenza in video ---- */
A.phExport = async () => {
  const list = photoList();
  if (list.length < 2) return toast('Servono almeno due foto');
  if (!window.MediaRecorder || !HTMLCanvasElement.prototype.captureStream) return toast('Questo telefono non permette di creare video dall\'app');
  const types = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
  const mime = types.find(t => MediaRecorder.isTypeSupported(t));
  if (!mime) return toast('Formato video non supportato');
  const per = 1000 / Math.max(2, NAV.ph.fps);
  if (!await confirmBox({ title: 'Creare il video?', text: `${list.length} foto, circa ${Math.ceil(list.length * per / 1000) + 1} secondi. Tieni l'app aperta finché non finisce.`, ok: 'Crea video' })) return;
  const W = 1080, H = 1350; const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  const m = document.createElement('div'); m.className = 'modal'; m.innerHTML = `<div class="mc"><h3>Creo il video</h3><p id="vx-p">0 di ${list.length}</p><div class="progress"><i id="vx-b" style="width:0"></i></div></div>`;
  document.body.append(m);
  try {
    const stream = c.captureStream(30);
    const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 6000000 });
    const chunks = []; rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    const stopped = new Promise(r => rec.onstop = r);
    const drawFrame = (img, p) => {
      g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
      const s = Math.max(W / img.naturalWidth, H / img.naturalHeight); const w = img.naturalWidth * s, h = img.naturalHeight * s;
      g.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
      const grd = g.createLinearGradient(0, H - 220, 0, H); grd.addColorStop(0, 'rgba(0,0,0,0)'); grd.addColorStop(1, 'rgba(0,0,0,.75)'); g.fillStyle = grd; g.fillRect(0, H - 220, W, 220);
      g.fillStyle = '#fff'; g.font = '800 56px -apple-system, BlinkMacSystemFont, sans-serif'; g.fillText(fmtDate(p.date, { year: true }), 56, H - 70);
      if (p.weight) { g.font = '700 44px -apple-system, BlinkMacSystemFont, sans-serif'; g.textAlign = 'right'; g.fillText(fmtNum(p.weight, 1) + ' kg', W - 56, H - 72); g.textAlign = 'left'; }
    };
    const first = await loadImg(await BlobURL.get(list[0].blobId)); drawFrame(first, list[0]);
    rec.start(250);
    for (let i = 0; i < list.length; i++) {
      const img = await loadImg(await BlobURL.get(list[i].blobId));
      drawFrame(img, list[i]);
      $('#vx-p').textContent = `${i + 1} di ${list.length}`; $('#vx-b').style.width = ((i + 1) / list.length * 100) + '%';
      await sleep(i === list.length - 1 ? 1200 : per);
    }
    rec.stop(); await stopped;
    const blob = new Blob(chunks, { type: mime.split(';')[0] });
    m.remove();
    const ext = mime.includes('mp4') ? 'mp4' : 'webm';
    const ok = await confirmBox({ title: 'Video pronto', text: `${fmtBytes(blob.size)}. Salvalo o condividilo.`, ok: 'Salva', cancel: 'Chiudi' });
    if (ok) await shareFile(blob, `Scheda-progressi-${dkey()}.${ext}`, blob.type);
  } catch (e) { console.error(e); m.remove(); toast('Video non creato: ' + e.message); }
};

/* ================= FOTOCAMERA con sagoma e timer ================= */
async function openCamera(date, sessionId) {
  if (!navigator.mediaDevices?.getUserMedia) { toast('Fotocamera non disponibile: uso la libreria'); return importPhotos(date, sessionId); }
  let facing = 'user', stream = null, timer = 3, cat = 'front', ghostOp = 0.35, counting = false;
  const el = document.createElement('div'); el.className = 'cam';
  const lastOf = c => live(S.photos).filter(p => p.cat === c).sort((a, b) => a.date < b.date ? 1 : -1)[0];
  el.innerHTML = `<div class="view"><video playsinline autoplay muted></video><img class="ghost" alt=""><div class="count" hidden></div>
    <div class="ctop"><button class="cbtn" data-c="close">${icon('x')}</button><div class="hstack"><button class="cbtn" data-c="timer">${icon('timer', 'sm')}<span>3s</span></button><button class="cbtn" data-c="flip">${icon('swap', 'sm')}</button></div></div></div>
    <div class="cbot"><div class="chips" style="justify-content:center">${Object.entries(PHOTO_CATS).map(([k, l]) => `<button class="chip" data-cat="${k}" aria-pressed="${k === cat}">${l}</button>`).join('')}</div>
      <label class="hstack small" style="gap:10px;color:#ccc">Sagoma<input type="range" min="0" max="70" value="35" id="cam-op" style="flex:1"></label>
      <div class="hstack between"><span class="cbtn tiny" id="cam-info"></span><button class="shutter" data-c="shoot" aria-label="Scatta"><i></i></button><span class="cbtn"></span></div></div>`;
  document.body.append(el);
  const video = $('video', el), ghost = $('.ghost', el), count = $('.count', el);
  const setGhost = async () => {
    const lp = lastOf(cat);
    if (lp) { ghost.src = await BlobURL.get(lp.blobId); ghost.hidden = false; $('#cam-info', el).textContent = 'Sagoma: ' + fmtDateShort(lp.date); }
    else { ghost.hidden = true; $('#cam-info', el).textContent = 'Nessuna sagoma'; }
    ghost.style.opacity = ghostOp;
  };
  const start = async () => {
    stream && stream.getTracks().forEach(t => t.stop());
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: { ideal: 1920 }, height: { ideal: 1440 } }, audio: false });
      video.srcObject = stream; video.classList.toggle('mirror', facing === 'user');
      ghost.style.transform = ''; // le foto sono già salvate come le vedi
    } catch (e) {
      close(); toast('Accesso alla fotocamera negato. Consenti la fotocamera nelle impostazioni o usa la libreria.');
    }
  };
  const close = () => { stream && stream.getTracks().forEach(t => t.stop()); el.remove(); };
  const shoot = async () => {
    if (counting) return; counting = true;
    for (let n = timer; n > 0; n--) { count.hidden = false; count.textContent = n; Sound.beep(1, 660); await sleep(1000); }
    count.hidden = true;
    const c = document.createElement('canvas'); c.width = video.videoWidth; c.height = video.videoHeight;
    const g = c.getContext('2d');
    if (facing === 'user') { g.translate(c.width, 0); g.scale(-1, 1); }
    g.drawImage(video, 0, 0);
    Sound.beep(1, 1200);
    el.style.background = '#fff'; setTimeout(() => el.style.background = '#000', 120);
    try {
      const b = await canvasBlob(c, 0.9);
      await savePhoto(b, date, sessionId, cat);
      toast('Foto salvata: ' + PHOTO_CATS[cat]);
      await setGhost();
    } catch (e) { toast('Foto non salvata: ' + e.message); }
    counting = false;
  };
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-c],[data-cat]'); if (!b) return;
    if (b.dataset.cat) { cat = b.dataset.cat; $$('[data-cat]', el).forEach(x => x.setAttribute('aria-pressed', x === b)); setGhost(); return; }
    const c = b.dataset.c;
    if (c === 'close') { close(); if (!document.querySelector('.finish')) rerender(); }
    if (c === 'flip') { facing = facing === 'user' ? 'environment' : 'user'; start(); }
    if (c === 'timer') { timer = { 0: 3, 3: 5, 5: 10, 10: 0 }[timer]; b.querySelector('span').textContent = timer ? timer + 's' : 'No'; }
    if (c === 'shoot') shoot();
  });
  $('#cam-op', el).addEventListener('input', e => { ghostOp = e.target.value / 100; ghost.style.opacity = ghostOp; });
  Sound.unlock();
  await start(); await setGhost();
}

/* ================= GRAFICI (SVG, una serie, tocca un punto per il valore) ================= */
function niceTicks(min, max, n = 4) {
  if (min === max) { const d = Math.abs(min) * 0.1 || 1; min -= d; max += d; }
  const span = max - min; const step0 = span / n; const mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => span / s <= n) || 10 * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const out = []; for (let v = lo; v <= hi + step / 2; v += step) out.push(Math.round(v * 1000) / 1000);
  return out;
}
/* pts: [{x: timestamp, y, lab}] ; opts: {unit, avg: [{x,y}] , height} */
function lineChart(pts, opts = {}) {
  if (!pts.length) return `<div class="empty small">Ancora nessun dato.</div>`;
  const W = 340, H = opts.height || 190, L = 40, R = 14, T = 14, B = 26;
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y).concat((opts.avg || []).map(p => p.y));
  let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x0 === x1) { x0 -= 86400000 * 3; x1 += 86400000 * 3; }
  const ticks = niceTicks(Math.min(...ys), Math.max(...ys));
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const X = x => L + (x - x0) / (x1 - x0) * (W - L - R);
  const Y = y => T + (1 - (y - y0) / (y1 - y0)) * (H - T - B);
  const path = pts.map((p, i) => `${i ? 'L' : 'M'}${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join('');
  const area = path + `L${X(pts[pts.length - 1].x).toFixed(1)},${Y(y0)}L${X(pts[0].x).toFixed(1)},${Y(y0)}Z`;
  let g = ticks.map(t => `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${L - 6}" y="${Y(t) + 4}" text-anchor="end">${fmtNum(t, 1)}</text>`).join('');
  // etichette asse x: prima e ultima data (+ metà se c'è spazio)
  const xl = pts.length === 1 ? [pts[0]] : [pts[0], pts[pts.length - 1]]; if (pts.length > 4) xl.splice(1, 0, pts[Math.floor(pts.length / 2)]);
  g += xl.map((p, i) => `<text x="${X(p.x)}" y="${H - 6}" text-anchor="${xl.length === 1 ? 'middle' : i === 0 ? 'start' : i === xl.length - 1 ? 'end' : 'middle'}">${fmtDateShort(dkey(new Date(p.x)))}</text>`).join('');
  const avg = opts.avg && opts.avg.length > 1 ? `<path class="ln2" d="${opts.avg.map((p, i) => `${i ? 'L' : 'M'}${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join('')}"/>` : '';
  const last = pts[pts.length - 1];
  const dots = pts.length <= 40 ? pts.map(p => `<circle class="pt" cx="${X(p.x)}" cy="${Y(p.y)}" r="${p === last ? 5 : 3.2}"/>`).join('') : `<circle class="pt" cx="${X(last.x)}" cy="${Y(last.y)}" r="5"/>`;
  const hits = pts.map((p, i) => `<rect class="hit" x="${X(p.x) - 12}" y="${T}" width="24" height="${H - T - B}" data-tip="${esc((p.lab || fmtDateShort(dkey(new Date(p.x)))) + ': ' + fmtNum(p.y, 1) + (opts.unit ? ' ' + opts.unit : ''))}" data-x="${X(p.x)}" data-y="${Y(p.y)}"/>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || 'Grafico')}">${g}<path class="ar" d="${area}"/>${avg}<path class="ln" d="${path}"/>${dots}${hits}<g class="tip" style="display:none"><rect rx="6" height="24"/><text y="16"></text></g></svg>`;
}
/* bars: [{lab, v, prev}] */
function barChart(bars, opts = {}) {
  if (!bars.length || bars.every(b => !b.v)) return `<div class="empty small">Ancora nessun dato.</div>`;
  const W = 340, H = opts.height || 170, L = 40, R = 8, T = 12, B = 24;
  const ticks = niceTicks(0, Math.max(...bars.map(b => b.v), 1));
  const y1 = ticks[ticks.length - 1];
  const Y = v => T + (1 - v / y1) * (H - T - B);
  const bw = (W - L - R) / bars.length;
  let g = ticks.map(t => `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${L - 6}" y="${Y(t) + 4}" text-anchor="end">${t >= 10000 ? fmtNum(t / 1000, 1) + 'k' : fmtNum(t, 1)}</text>`).join('');
  bars.forEach((b, i) => {
    const x = L + i * bw + bw * 0.18, w = bw * 0.64, y = Y(b.v), hh = Math.max(0, Y(0) - y);
    const r = Math.min(4, w / 2, hh);
    g += hh > 0 ? `<path class="bar ${b.dim ? 'prev' : ''}" d="M${x},${Y(0)}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${Y(0)}Z"/>` : '';
    if (bars.length <= 12 || i % 2 === 0) g += `<text x="${x + w / 2}" y="${H - 6}" text-anchor="middle">${esc(b.lab)}</text>`;
    g += `<rect class="hit" x="${L + i * bw}" y="${T}" width="${bw}" height="${H - T - B}" data-tip="${esc((b.full || b.lab) + ': ' + (opts.fmt ? opts.fmt(b.v) : fmtNum(b.v, 1)))}" data-x="${x + w / 2}" data-y="${y}"/>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || 'Grafico')}">${g}<g class="tip" style="display:none"><rect rx="6" height="24"/><text y="16"></text></g></svg>`;
}
// tooltip al tocco
document.addEventListener('pointerdown', e => {
  const h = e.target.closest('.chart .hit');
  $$('.chart .tip').forEach(t => t.style.display = 'none');
  if (!h) return;
  const svg = h.ownerSVGElement; const tip = svg.querySelector('.tip');
  const txt = tip.querySelector('text'); txt.textContent = h.dataset.tip;
  tip.style.display = '';
  const w = txt.getComputedTextLength() + 16;
  const vb = svg.viewBox.baseVal;
  let x = +h.dataset.x - w / 2; x = clamp(x, 0, vb.width - w);
  let y = +h.dataset.y - 34; if (y < 0) y = +h.dataset.y + 10;
  tip.querySelector('rect').setAttribute('width', w); tip.setAttribute('transform', `translate(${x},${y})`); txt.setAttribute('x', 8);
});

let manualZip = null;
A.backupNow = async (el) => {
  const full = el.dataset.full === '1';
  // prepara il file, poi chiede un tocco per aprire "Salva su File" (iOS lo richiede)
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="mc"><h3>Preparo il backup</h3><p id="bk-p">Ancora qualche secondo…</p><div class="progress"><i id="bk-b" style="width:0"></i></div><button class="btn primary block" id="bk-go" disabled>${icon('save', 'sm')}Salva il file</button><button class="btn ghost block" id="bk-x">Annulla</button></div>`;
  document.body.append(m);
  let cancelled = false; const t0 = Date.now();
  $('#bk-x', m).onclick = () => { cancelled = true; m.remove(); };
  try {
    const zip = await buildBackup(full, p => {
      $('#bk-b', m).style.width = (p * 100) + '%';
      const el2 = (Date.now() - t0) / 1000; if (p > 0.05) $('#bk-p', m).textContent = `Ancora ${Math.max(1, Math.ceil(el2 / p - el2))} secondi…`;
    });
    if (cancelled) return;
    const name = backupName(full, false);
    $('#bk-p', m).textContent = `Pronto: ${name} (${fmtBytes(zip.size)})`;
    const go = $('#bk-go', m); go.disabled = false;
    go.onclick = async () => {
      const r = await shareFile(zip, name);
      if (r === 'shared' || r === 'downloaded') { markBackup(zip.size); m.remove(); toast('Backup salvato'); rerender(); }
      else if (r === 'cancel') toast('Non salvato');
      else toast('Salvataggio non riuscito');
    };
  } catch (e) { m.remove(); toast('Backup non riuscito: ' + e.message); }
};
A.restore = async () => {
  const files = await pickFiles({ accept: '.zip,application/zip,application/x-zip-compressed' });
  if (files[0]) restoreBackup(files[0]);
};

/* ---- CSV ---- */
A.exportCSV = async () => {
  const rows = [['data', 'workout', 'esercizio', 'serie', 'tipo', 'kg', 'ripetizioni', 'rip_sinistra', 'secondi', 'km', 'nota_serie', 'fatica_seduta', 'durata_min']];
  const q = v => { const s = v == null ? '' : String(v); return /[;"\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  for (const s of doneSessions().sort((a, b) => a.startedAt - b.startedAt)) {
    const dur = Math.round((s.endedAt - s.startedAt) / 60000);
    if (!(s.items || []).length) rows.push([s.date, s.title, '', '', '', '', '', '', '', '', '', s.rpe ?? '', dur]);
    for (const it of s.items || []) it.sets.filter(x => x.done).forEach((x, j) => rows.push([s.date, s.title, it.name, j + 1, SET_TYPES[x.type], fmtNum(x.kg), x.reps ?? '', x.reps2 ?? '', x.sec ?? '', fmtNum(x.km), x.note || '', s.rpe ?? '', dur]));
  }
  // punto e virgola: Excel in italiano lo apre in colonne; BOM per gli accenti
  const csv = '﻿' + rows.map(r => r.map(q).join(';')).join('\r\n');
  const b = new Blob([csv], { type: 'text/csv' });
  const r = await shareFile(b, `Scheda-serie-${dkey()}.csv`, 'text/csv');
  if (r === 'error') toast('Esportazione non riuscita');
};

/* ---- PIN ---- */
let pinUnlocked = { app: false, photos: false };
function needPin(scope) { const st = S.settings; if (!st.pin) return false; if (scope === 'photos') return !pinUnlocked.photos && !pinUnlocked.app; return st.pinScope === 'app' && !pinUnlocked.app; }
function askPin(onOk, { setMode = false, title = 'Inserisci il PIN' } = {}) {
  let val = '';
  const el = document.createElement('div'); el.className = 'lock';
  el.innerHTML = `<div class="faint">${icon('lock', 'lg')}</div><b style="font-size:20px" id="pin-t">${esc(title)}</b><div class="dots">${'<i></i>'.repeat(4)}</div>
    <div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button data-n="${n}">${n}</button>`).join('')}<button data-n="x" style="background:none;font-size:15px">${setMode ? 'Annulla' : ''}</button><button data-n="0">0</button><button data-n="del" style="background:none">${icon('back')}</button></div>`;
  document.body.append(el);
  const dots = $$('.dots i', el);
  const upd = () => dots.forEach((d, i) => d.classList.toggle('on', i < val.length));
  el.addEventListener('click', async e => {
    const b = e.target.closest('[data-n]'); if (!b) return;
    const n = b.dataset.n;
    if (n === 'x') { if (setMode) el.remove(); return; }
    if (n === 'del') { val = val.slice(0, -1); upd(); return; }
    if (val.length >= 4) return;
    val += n; upd();
    if (val.length === 4) {
      if (setMode) { el.remove(); onOk(val); return; }
      const h = await sha256('scheda:' + val);
      if (h === S.settings.pin) { el.remove(); onOk(); }
      else { const d = $('.dots', el); d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake'); val = ''; setTimeout(upd, 300); }
    }
  });
}

    return navbar('Codice PIN') + `<div class="page sub">
      <div class="card pad small muted">Il PIN impedisce a chi prende in mano il telefono sbloccato di aprire l'app o le foto. Non è una cifratura: se lo dimentichi, puoi toglierlo solo cancellando i dati dell'app e ripristinando un backup.</div>
      ${st.pin ? `<div class="seg"><button aria-pressed="${st.pinScope === 'app'}" data-a="pinScope" data-v="app">Tutta l'app</button><button aria-pressed="${st.pinScope === 'photos'}" data-a="pinScope" data-v="photos">Solo le foto</button></div>
        <button class="btn block" data-a="pinNew">Cambia PIN</button><button class="btn danger block" data-a="pinOff">Disattiva PIN</button>`
        : `<button class="btn primary block" data-a="pinNew">${icon('lock', 'sm')}Imposta un PIN</button>`}</div>`;
  }
};
A.pinNew = () => {
  const setIt = () => askPin(p1 => askPin(async p2 => {
    if (p1 !== p2) return toast('I due PIN non coincidono');
    S.settings.pin = await sha256('scheda:' + p1); if (!S.settings.pinScope) S.settings.pinScope = 'photos';
    pinUnlocked = { app: true, photos: true }; save(); rerender(); toast('PIN impostato');
  }, { setMode: true, title: 'Ripeti il PIN' }), { setMode: true, title: 'Nuovo PIN (4 cifre)' });
  if (S.settings.pin) askPin(setIt, { title: 'PIN attuale' }); else setIt();
};
A.pinOff = () => askPin(() => { S.settings.pin = null; save(); rerender(); toast('PIN disattivato'); }, { title: 'PIN attuale' });
A.pinScope = (el) => { S.settings.pinScope = el.dataset.v; save(); rerender(); };

function showUpdate(reg) {
  const t = document.createElement('div'); t.className = 'toast on'; t.style.bottom = 'calc(env(safe-area-inset-bottom,0px) + var(--tab-h) + 22px)';
  t.innerHTML = `<span>Nuova versione disponibile</span><button>Aggiorna</button>`;
  document.body.append(t);
  t.querySelector('button').onclick = async () => {
    if (activeSession()) await Store.now();
    reg.waiting && reg.waiting.postMessage('skip');
  };
}
function registerSW() {
  if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
  let reloading = false;
  // al primo avvio il service worker prende il controllo: non serve ricaricare (e interromperebbe quello che stai facendo)
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (reloading || !hadController) return; reloading = true; location.reload(); });
  navigator.serviceWorker.register('sw.js').then(reg => {
    if (reg.waiting && navigator.serviceWorker.controller) showUpdate(reg);
    reg.addEventListener('updatefound', () => {
      const nw = reg.installing; if (!nw) return;
      nw.addEventListener('statechange', () => { if (nw.state === 'installed' && navigator.serviceWorker.controller) showUpdate(reg); });
    });
    // controlla aggiornamenti quando l'app torna in primo piano
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => { }); });
  }).catch(e => console.warn('SW', e));
}

    if (activeSession()) go('session');
    $('.launch')?.classList.add('off'); setTimeout(() => $('.launch')?.remove(), 300);
  };
  if (needPin('app')) { $('.launch')?.remove(); askPin(() => { pinUnlocked.app = true; go0(); }); }
  else go0();
  registerSW();
  // se l'app resta aperta oltre mezzanotte, "oggi" si aggiorna
  const dayCheck = () => { const k = dkey(); if (k !== lastDay) { lastDay = k; NAV.sel = null; if (!NAV.stack.length || top()?.view !== 'session') rerender(); } };
  setInterval(dayCheck, 30000);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') Store.now();
    else { dayCheck(); if (top()?.view === 'session') tickSession(); }
  });
  window.addEventListener('pagehide', () => Store.now());
}

}
