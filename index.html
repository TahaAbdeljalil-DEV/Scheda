<style>/* Scheda: app da palestra, layout a una colonna con barra in basso. Neutri freddi "gesso e ghisa", accento preso dai colori dei dischi olimpici. */
:root{
  --bg:#F3F4F6; --surface:#FFFFFF; --surface-2:#ECEEF1; --surface-3:#E2E5EA;
  --line:rgba(17,22,30,.09); --text:#12161D; --text-2:#5C6470; --text-3:#98A0AB;
  --good:#17905A; --warn:#C27C00; --bad:#D6362F;
  --accent:#1D5BDB; --accent-ink:#FFFFFF; --accent-soft:rgba(29,91,219,.12);
  --shadow:0 1px 2px rgba(17,22,30,.06),0 4px 16px rgba(17,22,30,.06);
  --scrim:rgba(8,10,14,.45);
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-num:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --r-lg:18px; --r-md:13px; --r-sm:9px;
  --tab-h:58px; --fs:1;
  color-scheme:light;
}
:root[data-accent="red"]{--accent:#D8322C;--accent-soft:rgba(216,50,44,.12);--accent-ink:#fff}
:root[data-accent="yellow"]{--accent:#C99500;--accent-soft:rgba(201,149,0,.14);--accent-ink:#1a1400}
:root[data-accent="green"]{--accent:#138A4F;--accent-soft:rgba(19,138,79,.13);--accent-ink:#fff}
:root[data-accent="iron"]{--accent:#2A313C;--accent-soft:rgba(42,49,60,.10);--accent-ink:#fff}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0C0F; --surface:#15181D; --surface-2:#1E2228; --surface-3:#282D35;
    --line:rgba(255,255,255,.08); --text:#F1F3F6; --text-2:#A2A9B4; --text-3:#666E7A;
    --good:#3CCB85; --warn:#F2B33D; --bad:#FF5F57;
    --accent:#4D84FF; --accent-soft:rgba(77,132,255,.16); --accent-ink:#fff;
    --shadow:none; --scrim:rgba(0,0,0,.6); color-scheme:dark;
  }
  :root:not([data-theme="light"])[data-accent="red"]{--accent:#FF524B;--accent-soft:rgba(255,82,75,.16)}
  :root:not([data-theme="light"])[data-accent="yellow"]{--accent:#FFC830;--accent-soft:rgba(255,200,48,.15);--accent-ink:#1a1400}
  :root:not([data-theme="light"])[data-accent="green"]{--accent:#34C77F;--accent-soft:rgba(52,199,127,.15);--accent-ink:#04140b}
  :root:not([data-theme="light"])[data-accent="iron"]{--accent:#E6E9EE;--accent-soft:rgba(230,233,238,.12);--accent-ink:#0A0C0F}
}
:root[data-theme="dark"]{
  --bg:#0A0C0F; --surface:#15181D; --surface-2:#1E2228; --surface-3:#282D35;
  --line:rgba(255,255,255,.08); --text:#F1F3F6; --text-2:#A2A9B4; --text-3:#666E7A;
  --good:#3CCB85; --warn:#F2B33D; --bad:#FF5F57;
  --accent:#4D84FF; --accent-soft:rgba(77,132,255,.16); --accent-ink:#fff;
  --shadow:none; --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
:root[data-theme="dark"][data-accent="red"]{--accent:#FF524B;--accent-soft:rgba(255,82,75,.16)}
:root[data-theme="dark"][data-accent="yellow"]{--accent:#FFC830;--accent-soft:rgba(255,200,48,.15);--accent-ink:#1a1400}
:root[data-theme="dark"][data-accent="green"]{--accent:#34C77F;--accent-soft:rgba(52,199,127,.15);--accent-ink:#04140b}
:root[data-theme="dark"][data-accent="iron"]{--accent:#E6E9EE;--accent-soft:rgba(230,233,238,.12);--accent-ink:#0A0C0F}
:root[data-big="1"]{--fs:1.18}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--f-ui);font-size:calc(16px*var(--fs));line-height:1.4;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
input,textarea,select{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
svg.i{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:18px;height:18px}
svg.i.lg{width:28px;height:28px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* ---------- shell ---------- */
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.scroller{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
.page{padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 28px);max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.page.no-tab{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 32px)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);
  padding:6px 8px calc(env(safe-area-inset-bottom,0px) + 4px);background:color-mix(in srgb,var(--surface) 88%,transparent);
  -webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border-top:1px solid var(--line)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--text-3);font-size:11px;font-weight:600;letter-spacing:.01em}
.tabbar button[aria-current="page"]{color:var(--accent)}
.tabbar svg.i{width:25px;height:25px}

/* ---------- headers ---------- */
.hdr{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;min-height:44px}
.hdr h1{margin:0;font-size:calc(32px*var(--fs));line-height:1.05;letter-spacing:-.02em;font-weight:800;text-wrap:balance}
.eyebrow{font-size:13px;font-weight:600;color:var(--text-2);letter-spacing:.02em}
.navbar{position:sticky;top:0;z-index:15;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;
  padding:calc(env(safe-area-inset-top,0px) + 6px) 8px 8px;background:color-mix(in srgb,var(--bg) 86%,transparent);
  -webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px)}
.navbar .ttl{font-weight:700;font-size:17px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw}
.navbar .l{justify-self:start}.navbar .r{justify-self:end;display:flex;gap:4px}
.navbtn{display:inline-flex;align-items:center;gap:2px;min-height:40px;padding:0 8px;border-radius:10px;color:var(--accent);font-weight:600;font-size:17px}
.navbtn:active{background:var(--accent-soft)}
.page.sub{padding-top:8px}
h2.sec{margin:6px 0 -6px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2)}
.sec-row{display:flex;justify-content:space-between;align-items:center;margin:6px 0 -6px}
.sec-row h2.sec{margin:0}
.link{color:var(--accent);font-weight:600;font-size:15px}

/* ---------- surfaces ---------- */
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);border:1px solid var(--line)}
.pad{padding:16px}
.list{background:var(--surface);border-radius:var(--r-lg);border:1px solid var(--line);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;min-height:52px;width:100%;text-align:left}
.row + .row{border-top:1px solid var(--line)}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600}
.row .s{font-size:13px;color:var(--text-2);margin-top:1px}
.row .chev{color:var(--text-3)}
button.row:active,.row.tap:active{background:var(--surface-2)}
.muted{color:var(--text-2)}.faint{color:var(--text-3)}
.small{font-size:13px}.tiny{font-size:11.5px}
.empty{text-align:center;padding:28px 16px;color:var(--text-2);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty svg.i{width:34px;height:34px;color:var(--text-3)}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.hstack{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;font-weight:700;font-size:16px;
  background:var(--surface-2);color:var(--text);transition:transform .12s ease,opacity .12s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:11px}
.btn[disabled]{opacity:.45;pointer-events:none}
.iconbtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;color:var(--text-2)}
.iconbtn:active{background:var(--surface-2)}
.iconbtn.acc{color:var(--accent)}
.fab{position:fixed;right:18px;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 18px);z-index:19;width:56px;height:56px;border-radius:18px;
  display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.fab svg.i{width:26px;height:26px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row > *{flex:1 1 auto}

/* ---------- chips / pills ---------- */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 13px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--text-2)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--text-2)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.good{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;min-height:34px;border-radius:9px;font-weight:600;font-size:14px;color:var(--text-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days button{min-height:42px;border-radius:12px;background:var(--surface-2);font-weight:700;font-size:14px;color:var(--text-2)}
.days button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:6px}
.field > label,.lbl{font-size:13px;font-weight:600;color:var(--text-2)}
.inp,textarea.inp,select.inp{width:100%;min-height:48px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:16px;-webkit-appearance:none;appearance:none}
textarea.inp{min-height:84px;resize:vertical;line-height:1.4}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.inp::placeholder{color:var(--text-3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.switch{position:relative;width:51px;height:31px;flex:none;border-radius:999px;background:var(--surface-3);transition:background .15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .18s ease}
.switch[aria-checked="true"]{background:var(--good)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.swatches{display:flex;gap:12px;flex-wrap:wrap}
.swatch{width:40px;height:40px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--text)}

/* ---------- today ---------- */
.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 7px;border-radius:14px;color:var(--text-2)}
.wd .n{font-family:var(--f-num);font-weight:700;font-size:17px;color:var(--text)}
.wd .l{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.wd .dot{width:6px;height:6px;border-radius:50%;background:transparent}
.wd .dot.plan{background:var(--text-3)}
.wd .dot.done{background:var(--good)}
.wd.today .n{color:var(--accent)}
.wd[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--line)}
.wcard{position:relative;display:flex;gap:14px;align-items:center;padding:16px;background:var(--surface);border-radius:var(--r-lg);border:1px solid var(--line);box-shadow:var(--shadow);width:100%;text-align:left}
.wcard:active{transform:scale(.99)}
.wicon{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;font-size:22px;background:var(--wc,var(--accent-soft));color:#fff}
.wcard .t{font-weight:700;font-size:calc(17px*var(--fs))}
.wcard .s{font-size:13px;color:var(--text-2);margin-top:2px}
.wcard.done{opacity:.72}
.wcard .go{margin-left:auto}
.rest{padding:26px 18px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.rest .big{font-size:calc(40px*var(--fs));font-weight:800;letter-spacing:-.02em}
.banner{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--accent-soft);color:var(--text);font-size:14px;width:100%;text-align:left}
.banner svg.i{color:var(--accent)}
.banner.warn{background:color-mix(in srgb,var(--warn) 14%,transparent)}
.banner.warn svg.i{color:var(--warn)}
.banner.live{background:var(--accent);color:var(--accent-ink)}
.banner.live svg.i{color:var(--accent-ink)}
.meta-row{display:flex;flex-wrap:wrap;gap:6px}
.thumbs{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px 2px;scrollbar-width:none}
.thumbs::-webkit-scrollbar{display:none}
.thumb{flex:none;width:76px;height:96px;border-radius:12px;overflow:hidden;background:var(--surface-2);display:grid;place-items:center;color:var(--text-3);border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb.add{border:1.5px dashed var(--text-3);background:transparent}

/* ---------- workout detail / editor ---------- */
.exrow{display:flex;gap:12px;align-items:center;padding:13px 16px;width:100%;text-align:left}
.exrow + .exrow{border-top:1px solid var(--line)}
.exrow .ix{width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--text-2);flex:none}
.exrow .media-ic{color:var(--accent)}
.grp{border-left:3px solid var(--accent);}
.item-ed{padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px}
.item-ed + .item-ed{border-top:1px solid var(--line)}
.set-ed{display:grid;grid-template-columns:34px 1fr 1fr 34px;gap:6px;align-items:center}
.set-ed .tp{height:36px;border-radius:9px;background:var(--surface-2);font-weight:800;font-size:13px}
.set-ed .tp.W{color:var(--warn)}.set-ed .tp.D{color:var(--accent)}.set-ed .tp.F{color:var(--bad)}
.mini{min-height:38px;padding:6px 10px;border-radius:10px;font-size:16px;text-align:center}
.drag{touch-action:none;color:var(--text-3);cursor:grab}
.dragging{opacity:.9;box-shadow:0 10px 30px rgba(0,0,0,.25);position:relative;z-index:5;background:var(--surface)}

/* ---------- session ---------- */
.sess-top{position:sticky;top:0;z-index:15;padding:calc(env(safe-area-inset-top,0px) + 6px) 12px 10px;background:color-mix(in srgb,var(--bg) 88%,transparent);
  -webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);display:flex;flex-direction:column;gap:8px}
.sess-top .clock{font-family:var(--f-num);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.progress{height:5px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.progress > i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s ease}
.exblock{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.exblock.sup{border-left:4px solid var(--accent)}
.exhead{display:flex;align-items:flex-start;gap:10px;padding:14px 14px 8px}
.exhead .t{font-weight:800;font-size:calc(18px*var(--fs));line-height:1.2}
.prev{font-size:12.5px;color:var(--text-2);margin-top:3px}
.sugg{display:inline-flex;align-items:center;gap:4px;margin-top:6px;padding:4px 9px;border-radius:999px;background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good);font-size:12.5px;font-weight:700}
.sethdr,.setrow{display:grid;grid-template-columns:36px minmax(0,1fr) minmax(0,1fr) 52px;gap:8px;align-items:center;padding:0 12px}
.sethdr{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);padding-bottom:4px}
.sethdr span{text-align:center}
.setrow{position:relative;padding-top:5px;padding-bottom:5px;background:var(--surface);transition:background .15s}
.setrow.done{background:color-mix(in srgb,var(--good) 10%,var(--surface))}
.setrow .no{height:40px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;font-weight:800;font-size:14px;background:var(--surface-2);color:var(--text-2)}
.setrow .no.W{color:var(--warn)}.setrow .no.D{color:var(--accent)}.setrow .no.F{color:var(--bad)}
.setrow .cell{display:flex;align-items:center;gap:0;background:var(--surface-2);border-radius:11px;min-width:0;height:44px}
.setrow .cell input{flex:1;min-width:0;height:44px;border:0;background:transparent;text-align:center;font-family:var(--f-num);font-weight:700;font-size:calc(19px*var(--fs));color:var(--text);padding:0 2px}
.setrow .cell input::placeholder{color:var(--text-3);font-weight:600}
.setrow .cell input:focus{outline:none}
.setrow .cell .st{width:30px;height:44px;flex:none;color:var(--text-2);font-size:20px;font-weight:700;display:grid;place-items:center}
.setrow .cell .st:active{color:var(--accent)}
.setrow .ck{height:44px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--text-3)}
.setrow.done .ck{background:var(--good);color:#fff}
.setrow .snote{grid-column:2 / 4;font-size:12.5px;color:var(--text-2);padding:0 4px}
.swipe-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-weight:700;font-size:13px;color:#fff;pointer-events:none}
.exfoot{display:flex;gap:6px;padding:8px 12px 12px;flex-wrap:wrap}
.restbar{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:30;display:flex;align-items:center;gap:10px;padding:10px 10px 10px 16px;
  border-radius:20px;background:var(--text);color:var(--bg);box-shadow:0 10px 30px rgba(0,0,0,.3);transform:translateY(0);transition:transform .2s ease}
.restbar .tm{font-family:var(--f-num);font-weight:800;font-size:28px;font-variant-numeric:tabular-nums;min-width:78px}
.restbar .rb{min-height:40px;padding:0 12px;border-radius:12px;background:color-mix(in srgb,var(--bg) 14%,transparent);font-weight:700;font-size:15px}
.restbar .ring{height:4px;position:absolute;left:16px;right:16px;bottom:6px;border-radius:4px;background:color-mix(in srgb,var(--bg) 18%,transparent);overflow:hidden}
.restbar .ring i{display:block;height:100%;background:var(--accent)}
.flash{position:fixed;inset:0;z-index:60;background:var(--accent);color:var(--accent-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;animation:flash 1.8s ease forwards;pointer-events:none}
.flash b{font-size:40px;font-weight:800;letter-spacing:-.02em}
@keyframes flash{0%{opacity:0}8%{opacity:1}70%{opacity:1}100%{opacity:0}}

/* ---------- overlays ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);opacity:0;transition:opacity .2s ease}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92%;display:flex;flex-direction:column;background:var(--bg);border-radius:22px 22px 0 0;
  transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px);max-width:680px;margin:0 auto}
.sheet.on{transform:translateY(0)}
.sheet .grab{width:38px;height:5px;border-radius:9px;background:var(--surface-3);margin:8px auto 2px;flex:none}
.sheet .sh-h{display:flex;align-items:center;justify-content:space-between;padding:4px 8px 6px 18px;flex:none}
.sheet .sh-h b{font-size:18px}
.sheet .sh-b{overflow-y:auto;padding:4px 16px 18px;display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.screen{position:fixed;inset:0;z-index:35;background:var(--bg);display:flex;flex-direction:column;animation:slidein .22s cubic-bezier(.2,.8,.2,1)}
@keyframes slidein{from{transform:translateX(24px);opacity:.3}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + var(--tab-h) + 22px);z-index:70;transform:translate(-50%,20px);opacity:0;
  display:flex;align-items:center;gap:12px;max-width:calc(100% - 32px);padding:12px 14px 12px 16px;border-radius:16px;background:var(--text);color:var(--bg);font-weight:600;font-size:15px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);transition:all .22s ease}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast button{color:var(--accent);font-weight:800;padding:4px 6px;filter:brightness(1.3)}
.toast.pr{background:var(--accent);color:var(--accent-ink)}
.quote{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:24px;background:var(--scrim);animation:fade .2s ease}
.quote .qc{max-width:420px;width:100%;background:var(--surface);border-radius:24px;padding:28px 24px 22px;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:pop .28s cubic-bezier(.2,.9,.3,1.2);display:flex;flex-direction:column;gap:14px}
.quote .qk{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.quote .qt{font-size:24px;line-height:1.25;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.quote .qbar{height:3px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.quote .qbar i{display:block;height:100%;background:var(--accent);animation:qbar 4.2s linear forwards}
@keyframes qbar{from{width:100%}to{width:0}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.modal{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:24px;background:var(--scrim);animation:fade .15s ease}
.modal .mc{width:100%;max-width:360px;background:var(--surface);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px;animation:pop .2s ease}
.modal .mc h3{margin:0;font-size:18px}
.modal .mc p{margin:0;color:var(--text-2);font-size:15px}

/* ---------- finish ---------- */
.finish{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;animation:fade .25s ease}
.finish .in{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 28px) 18px calc(env(safe-area-inset-bottom,0px) + 28px);display:flex;flex-direction:column;gap:18px;align-items:stretch}
.medal{position:relative;width:168px;height:168px;margin:6px auto 0;display:grid;place-items:center;border-radius:50%}
.medal svg.ringsvg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.medal .core{width:124px;height:124px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 12px 36px color-mix(in srgb,var(--accent) 45%,transparent);animation:medal .5s cubic-bezier(.2,.9,.3,1.3)}
.medal .core svg.i{width:62px;height:62px;stroke-width:2.6}
.medal .core .num{font-size:40px;font-weight:800}
.medal.tap .core{animation:medal .5s cubic-bezier(.2,.9,.3,1.3),pulse 1.6s ease-in-out .6s infinite}
@keyframes medal{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.finish h2{margin:0;text-align:center;font-size:30px;font-weight:800;letter-spacing:-.02em}
.finish .sub{text-align:center;color:var(--text-2);margin-top:-10px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.stat .v{font-family:var(--f-num);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .k{font-size:12.5px;color:var(--text-2);font-weight:600}
.fquote{padding:16px 18px;border-radius:18px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:18px;line-height:1.3;text-align:center;text-wrap:balance}

/* ---------- progress / photos ---------- */
.player{position:relative;border-radius:20px;overflow:hidden;background:#000;aspect-ratio:4/5;max-width:100%}
.player img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.player .ov{position:absolute;left:0;right:0;bottom:0;padding:34px 14px 12px;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff;display:flex;justify-content:space-between;align-items:flex-end;font-weight:700}
.player .ov .d{font-size:17px}.player .ov .w{font-family:var(--f-num);font-size:15px;opacity:.9}
.player .cnt{position:absolute;top:10px;right:10px;padding:3px 9px;border-radius:99px;background:rgba(0,0,0,.5);color:#fff;font-size:12px;font-weight:700}
input[type=range]{width:100%;accent-color:var(--accent);height:30px}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.pgrid button{aspect-ratio:3/4;border-radius:8px;overflow:hidden;background:var(--surface-2);position:relative}
.pgrid img{width:100%;height:100%;object-fit:cover}
.pgrid .fv{position:absolute;top:4px;right:4px;color:#FFD23F;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:4px;border-radius:18px;overflow:hidden;touch-action:none}
.cmp .pane{position:relative;aspect-ratio:3/4;overflow:hidden;background:#000}
.cmp .pane img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:center}
.cmp .pane .lb{position:absolute;left:8px;bottom:8px;padding:3px 8px;border-radius:8px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;font-weight:700}
.overlay-cmp{position:relative;aspect-ratio:3/4;border-radius:18px;overflow:hidden;background:#000;touch-action:none}
.overlay-cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.overlay-cmp .top{clip-path:inset(0 0 0 50%)}
.overlay-cmp .handle{position:absolute;top:0;bottom:0;width:2px;background:#fff;left:50%;box-shadow:0 0 8px rgba(0,0,0,.5)}
.overlay-cmp .handle::after{content:"";position:absolute;top:50%;left:50%;width:34px;height:34px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 2px 8px rgba(0,0,0,.4)}
.chart{width:100%;display:block;overflow:visible}
.chart text{fill:var(--text-3);font-size:11px;font-family:var(--f-ui)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .ln2{fill:none;stroke:var(--text-2);stroke-width:2;stroke-dasharray:4 4}
.chart .ar{fill:var(--accent-soft);stroke:none}
.chart .pt{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .bar{fill:var(--accent)}
.chart .bar.prev{fill:var(--surface-3)}
.chart .hit{fill:transparent}
.chart .tip rect{fill:var(--text)}
.chart .tip text{fill:var(--bg);font-weight:700;font-size:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:11px;font-weight:700;color:var(--text-3);padding:4px 0}
.cal .d{aspect-ratio:1;display:grid;place-items:center;border-radius:12px;font-family:var(--f-num);font-weight:700;font-size:15px;color:var(--text-2);position:relative}
.cal .d.on{background:var(--accent);color:var(--accent-ink)}
.cal .d.plan::after{content:"";position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--text-3)}
.cal .d.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .d.pause{background:var(--surface-2);color:var(--text-3)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:11px;height:11px;border-radius:3px;background:var(--surface-3)}
.heat i.l1{background:color-mix(in srgb,var(--accent) 45%,var(--surface-3))}
.heat i.l2{background:var(--accent)}
.bigval{font-family:var(--f-num);font-weight:800;font-size:34px;letter-spacing:-.01em;line-height:1}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kv > div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.kv .v{font-family:var(--f-num);font-weight:800;font-size:20px}
.kv .k{font-size:12px;color:var(--text-2);font-weight:600}
.bar-h{height:8px;border-radius:9px;background:var(--surface-3);overflow:hidden}
.bar-h i{display:block;height:100%;background:var(--accent);border-radius:9px}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
table.tbl th,table.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left}
table.tbl th{font-size:12px;color:var(--text-2);font-weight:700}
table.tbl td.n{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:700}

/* ---------- camera ---------- */
.cam{position:fixed;inset:0;z-index:95;background:#000;color:#fff;display:flex;flex-direction:column}
.cam .view{position:relative;flex:1;overflow:hidden}
.cam video,.cam .ghost{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam video.mirror{transform:scaleX(-1)}
.cam .ghost{pointer-events:none}
.cam .count{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-num);font-size:140px;font-weight:800;text-shadow:0 4px 30px rgba(0,0,0,.5)}
.cam .ctop{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(rgba(0,0,0,.5),transparent)}
.cam .cbot{padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;flex-direction:column;gap:12px;background:#000}
.cam .shutter{width:76px;height:76px;border-radius:50%;border:4px solid #fff;display:grid;place-items:center}
.cam .shutter i{width:60px;height:60px;border-radius:50%;background:#fff;display:block}
.cam .cbtn{color:#fff;min-width:56px;min-height:44px;font-weight:700;display:grid;place-items:center;border-radius:12px}
.cam .chips .chip{background:rgba(255,255,255,.12);color:#fff;border-color:transparent}
.cam .chips .chip[aria-pressed="true"]{background:#fff;color:#000}

/* ---------- lock ---------- */
.lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:24px}
.lock .dots{display:flex;gap:16px}
.lock .dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--text-2)}
.lock .dots i.on{background:var(--text);border-color:var(--text)}
.lock .pad{display:grid;grid-template-columns:repeat(3,76px);gap:16px}
.lock .pad button{width:76px;height:76px;border-radius:50%;background:var(--surface-2);font-family:var(--f-num);font-size:30px;font-weight:600}
.lock .pad button:active{background:var(--surface-3)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-10px)}50%{transform:translateX(10px)}75%{transform:translateX(-6px)}}

.plates{display:flex;align-items:center;gap:3px;justify-content:center;min-height:120px;padding:10px 0}
.plates .bar{width:60px;height:12px;border-radius:3px;background:var(--text-3)}
.plates .pl{border-radius:4px;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:800;writing-mode:vertical-rl}
.launch{position:fixed;inset:0;z-index:200;background:#0A0C0F;display:grid;place-items:center;transition:opacity .25s ease}
.launch.off{opacity:0;pointer-events:none}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

.setrow .no small{font-size:9.5px;font-weight:700;color:var(--text-3);letter-spacing:-.01em}
.target{margin-top:6px;font-weight:700;font-size:14px;color:var(--text)}
button.term{display:inline;padding:0 1px;font:inherit;color:var(--accent);text-decoration:underline dotted;text-underline-offset:3px;font-weight:inherit}
.guide p.gp,p.gp{margin:0;font-size:calc(16px*var(--fs));line-height:1.55;color:var(--text)}
h3.gh{margin:8px 0 -4px;font-size:18px;font-weight:800}
ul.gl{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;line-height:1.5}
.tblwrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
table.tbl.g{min-width:520px;background:var(--surface);border-radius:14px;overflow:hidden;border:1px solid var(--line);font-size:13.5px;line-height:1.4}
table.tbl.g td,table.tbl.g th{vertical-align:top;padding:9px 10px}
table.tbl.g th{background:var(--surface-2)}
table.tbl.g tr.hl td{background:var(--accent-soft);font-weight:600}
mark{background:var(--accent-soft);color:var(--text);border-radius:3px;padding:0 2px}
.anim{position:relative;border-radius:16px;overflow:hidden;background:#fff;aspect-ratio:auto}
.anim img{display:block;width:100%}
.anim img.f2{position:absolute;inset:0;animation:frame2 1.6s steps(1) infinite}
@keyframes frame2{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
.anim .tag{position:absolute;left:8px;bottom:8px;padding:3px 8px;border-radius:8px;background:rgba(0,0,0,.6);color:#fff;font-size:11.5px;font-weight:700}
details.blk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
details.blk summary{list-style:none;padding:14px 16px;font-weight:700;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
details.blk summary::-webkit-details-marker{display:none}
details.blk[open] summary{border-bottom:1px solid var(--line)}
.wkchips{display:flex;gap:6px;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.wkchips::-webkit-scrollbar{display:none}

.inp,.mini{min-width:0}
input[type=date].inp{min-width:0;display:block}
.grid2 > *,.grid3 > *{min-width:0}
</style>

<div id="app"></div>
<noscript>Per usare Scheda serve JavaScript.</noscript>
<script>
(() => {
/* ---- 00-util.js ---- */
'use strict';
/* ================= utilità ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pad2 = n => String(n).padStart(2, '0');

// numeri: accetta "72,5" e "72.5"
function parseNum(v) {
  if (v === null || v === undefined) return null;
  const s = String(v).trim().replace(',', '.').replace(/[^0-9.\-]/g, '');
  if (s === '' || s === '-' || s === '.') return null;
  const n = parseFloat(s);
  return Number.isFinite(n) ? n : null;
}
function fmtNum(n, dec = 2) {
  if (n === null || n === undefined || !Number.isFinite(n)) return '';
  const r = Math.round(n * Math.pow(10, dec)) / Math.pow(10, dec);
  return String(r).replace('.', ',');
}
function fmtKg(n) { return n === null || n === undefined ? '' : fmtNum(n) + ' kg'; }
function fmtBig(n) {
  if (!Number.isFinite(n)) return '0';
  return Math.round(n).toLocaleString('it-IT');
}
function fmtBytes(b) {
  if (!b) return '0 KB';
  if (b < 1024 * 1024) return Math.max(1, Math.round(b / 1024)) + ' KB';
  if (b < 1024 * 1024 * 1024) return fmtNum(b / 1024 / 1024, 1) + ' MB';
  return fmtNum(b / 1024 / 1024 / 1024, 2) + ' GB';
}
function fmtDur(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
  return h ? `${h}:${pad2(m)}:${pad2(ss)}` : `${m}:${pad2(ss)}`;
}
function fmtMin(min) {
  min = Math.round(min);
  if (min < 60) return min + ' min';
  const h = Math.floor(min / 60), m = min % 60;
  return m ? `${h} h ${m} min` : `${h} h`;
}
function fmtSec(sec) {
  if (sec === null || sec === undefined) return '';
  sec = Math.round(sec);
  if (sec < 60) return sec + '"';
  const m = Math.floor(sec / 60), s = sec % 60;
  return s ? `${m}'${pad2(s)}"` : `${m}'`;
}

/* ---- date (sempre ora locale; settimana da lunedì) ---- */
const DOW_SHORT = ['Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab', 'Dom'];
const DOW_LONG = ['lunedì', 'martedì', 'mercoledì', 'giovedì', 'venerdì', 'sabato', 'domenica'];
const MONTHS = ['gennaio', 'febbraio', 'marzo', 'aprile', 'maggio', 'giugno', 'luglio', 'agosto', 'settembre', 'ottobre', 'novembre', 'dicembre'];
const MONTHS_S = ['gen', 'feb', 'mar', 'apr', 'mag', 'giu', 'lug', 'ago', 'set', 'ott', 'nov', 'dic'];
function dkey(d = new Date()) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
function parseKey(k) { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d, 12, 0, 0); }
function isoDow(d) { return ((d.getDay() + 6) % 7) + 1; } // 1 = lunedì ... 7 = domenica
function addDays(k, n) { const d = parseKey(k); d.setDate(d.getDate() + n); return dkey(d); }
function diffDays(a, b) { return Math.round((parseKey(b) - parseKey(a)) / 86400000); }
function weekStart(k) { const d = parseKey(k); return addDays(k, -(isoDow(d) - 1)); }
function fmtDate(k, opts = {}) {
  const d = parseKey(k);
  const base = `${d.getDate()} ${MONTHS[d.getMonth()]}`;
  const y = d.getFullYear() !== new Date().getFullYear() || opts.year ? ' ' + d.getFullYear() : '';
  const w = opts.dow ? DOW_LONG[isoDow(d) - 1] + ' ' : '';
  return w + base + y;
}
function fmtDateShort(k) { const d = parseKey(k); return `${d.getDate()} ${MONTHS_S[d.getMonth()]}${d.getFullYear() !== new Date().getFullYear() ? ' ' + String(d.getFullYear()).slice(2) : ''}`; }
function relDay(k) {
  const t = dkey(); const n = diffDays(t, k);
  if (n === 0) return 'oggi'; if (n === 1) return 'domani'; if (n === -1) return 'ieri';
  if (n < 0 && n > -7) return `${-n} giorni fa`;
  return fmtDateShort(k);
}
function cap(s) { return s ? s[0].toUpperCase() + s.slice(1) : s; }

/* ---- vari ---- */
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
async function sha256(s) {
  try {
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
    return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join('');
  } catch (e) { // fallback se crypto.subtle non c'è (http)
    let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0; return 'x' + h;
  }
}
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function e1rm(kg, reps) { if (!kg || !reps || reps < 1) return 0; if (reps === 1) return kg; return kg * (1 + Math.min(reps, 15) / 30); }

/* ================= archivio (IndexedDB) =================
   'kv'    -> stato dell'app (un solo documento JSON, piccolo)
   'blobs' -> foto e video, uno per chiave                       */
const DB = (() => {
  let dbp = null;
  function open() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      const r = indexedDB.open('scheda', 1);
      r.onupgradeneeded = () => {
        const d = r.result;
        if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
        if (!d.objectStoreNames.contains('blobs')) d.createObjectStore('blobs');
      };
      r.onsuccess = () => {
        const d = r.result;
        d.onversionchange = () => d.close();
        res(d);
      };
      r.onerror = () => rej(r.error);
      r.onblocked = () => rej(new Error('Database bloccato: chiudi le altre schede dell\'app.'));
    });
    return dbp;
  }
  async function tx(store, mode, fn) {
    const d = await open();
    return new Promise((res, rej) => {
      let out;
      const t = d.transaction(store, mode);
      const s = t.objectStore(store);
      Promise.resolve(fn(s)).then(v => { out = v; });
      t.oncomplete = () => res(out);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error || new Error('Transazione annullata'));
    });
  }
  const req = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  return {
    get: (k) => tx('kv', 'readonly', s => req(s.get(k))),
    put: (k, v) => tx('kv', 'readwrite', s => { s.put(v, k); }),
    blobGet: (k) => tx('blobs', 'readonly', s => req(s.get(k))),
    blobPut: (k, v) => tx('blobs', 'readwrite', s => { s.put(v, k); }),
    blobDel: (k) => tx('blobs', 'readwrite', s => { s.delete(k); }),
    blobKeys: () => tx('blobs', 'readonly', s => req(s.getAllKeys())),
    clearAll: async () => { await tx('kv', 'readwrite', s => { s.clear(); }); await tx('blobs', 'readwrite', s => { s.clear(); }); },
  };
})();

/* URL temporanei per le immagini, con cache */
const BlobURL = (() => {
  const cache = new Map();
  return {
    async get(id) {
      if (!id) return '';
      if (cache.has(id)) return cache.get(id);
      const rec = await DB.blobGet(id);
      if (!rec) return '';
      const u = URL.createObjectURL(rec.blob || rec);
      cache.set(id, u);
      return u;
    },
    peek(id) { return cache.get(id) || ''; },
    drop(id) { const u = cache.get(id); if (u) { URL.revokeObjectURL(u); cache.delete(id); } },
    clear() { for (const u of cache.values()) URL.revokeObjectURL(u); cache.clear(); }
  };
})();
// riempie <img data-blob="id"> in modo asincrono
async function hydrateImages(root = document) {
  const imgs = $$('img[data-blob]', root);
  for (const img of imgs) {
    const id = img.getAttribute('data-blob');
    const u = BlobURL.peek(id) || await BlobURL.get(id);
    if (u && img.src !== u) img.src = u;
  }
  for (const v of $$('video[data-blob]', root)) {
    const id = v.getAttribute('data-blob');
    const u = await BlobURL.get(id);
    if (u && v.src !== u) v.src = u;
  }
}

/* ---- 02-zip.js ---- */
/* ================= ZIP senza compressione (store) =================
   Le foto sono già JPEG compressi: comprimere di nuovo non serve e rallenta.
   Scrittura e lettura lavorano a pezzi per non esaurire la memoria del telefono. */
const Zip = (() => {
  const T = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; T[n] = c >>> 0; }
  function crcUpdate(crc, u8) { let c = crc ^ 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = T[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
  async function crcBlob(blob, onBytes) {
    let crc = 0; const CH = 4 * 1024 * 1024;
    for (let o = 0; o < blob.size; o += CH) {
      const u8 = new Uint8Array(await blob.slice(o, o + CH).arrayBuffer());
      crc = crcUpdate(crc, u8);
      onBytes && onBytes(u8.length);
      if (o % (16 * 1024 * 1024) === 0) await sleep(0); // lascia respirare la UI
    }
    return crc;
  }
  function dosTime(d) {
    return {
      time: (d.getHours() << 11) | (d.getMinutes() << 5) | (Math.floor(d.getSeconds() / 2)),
      date: ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()
    };
  }
  // files: [{name, blob}]  -> Blob zip
  async function write(files, onProgress) {
    const enc = new TextEncoder();
    const parts = [], central = [];
    let offset = 0, done = 0;
    const total = files.reduce((a, f) => a + f.blob.size, 0) || 1;
    const { time, date } = dosTime(new Date());
    for (const f of files) {
      const name = enc.encode(f.name);
      const crc = await crcBlob(f.blob, b => { done += b; onProgress && onProgress(done / total); });
      const size = f.blob.size;
      if (size > 0xFFFFFFFF || offset > 0xFFFFFFFF) throw new Error('Backup troppo grande (oltre 4 GB).');
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
      lh.setUint16(10, time, true); lh.setUint16(12, date, true); lh.setUint32(14, crc, true);
      lh.setUint32(18, size, true); lh.setUint32(22, size, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
      parts.push(lh.buffer, name, f.blob);
      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
      ch.setUint16(12, time, true); ch.setUint16(14, date, true); ch.setUint32(16, crc, true); ch.setUint32(20, size, true); ch.setUint32(24, size, true);
      ch.setUint16(28, name.length, true); ch.setUint16(30, 0, true); ch.setUint16(32, 0, true); ch.setUint16(34, 0, true); ch.setUint16(36, 0, true);
      ch.setUint32(38, 0, true); ch.setUint32(42, offset, true);
      central.push(ch.buffer, name);
      offset += 30 + name.length + size;
    }
    const cdSize = central.reduce((a, b) => a + (b.byteLength ?? b.length), 0);
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
    end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
    onProgress && onProgress(1);
    return new Blob([...parts, ...central, end.buffer], { type: 'application/zip' });
  }
  // file: Blob/File -> Map(name -> Blob)
  async function read(file) {
    const tailLen = Math.min(file.size, 65557);
    const tail = new DataView(await file.slice(file.size - tailLen).arrayBuffer());
    let eocd = -1;
    for (let i = tail.byteLength - 22; i >= 0; i--) { if (tail.getUint32(i, true) === 0x06054b50) { eocd = i; break; } }
    if (eocd < 0) throw new Error('Il file non è un backup valido (zip non riconosciuto).');
    const count = tail.getUint16(eocd + 10, true);
    const cdSize = tail.getUint32(eocd + 12, true);
    const cdOff = tail.getUint32(eocd + 16, true);
    const cd = new DataView(await file.slice(cdOff, cdOff + cdSize).arrayBuffer());
    const dec = new TextDecoder();
    const out = new Map();
    let p = 0;
    for (let i = 0; i < count; i++) {
      if (cd.getUint32(p, true) !== 0x02014b50) throw new Error('Backup danneggiato.');
      const method = cd.getUint16(p + 10, true);
      const csize = cd.getUint32(p + 20, true);
      const nlen = cd.getUint16(p + 28, true), xlen = cd.getUint16(p + 30, true), clen = cd.getUint16(p + 32, true);
      const lho = cd.getUint32(p + 42, true);
      const name = dec.decode(new Uint8Array(cd.buffer, cd.byteOffset + p + 46, nlen));
      if (method !== 0) throw new Error('Backup compresso non supportato. Usa un file creato da Scheda.');
      const lh = new DataView(await file.slice(lho, lho + 30).arrayBuffer());
      const start = lho + 30 + lh.getUint16(26, true) + lh.getUint16(28, true);
      out.set(name, file.slice(start, start + csize));
      p += 46 + nlen + xlen + clen;
    }
    return out;
  }
  return { write, read };
})();

let S = defaultState();

const Store = (() => {
  let dirty = false;
  const flush = async () => {
    if (!dirty) return;
    dirty = false;
    try { await DB.put('state', JSON.stringify(S, (k, v) => k && k[0] === '_' ? undefined : v)); }
    catch (e) { dirty = true; console.error(e); toast('Salvataggio non riuscito: spazio pieno?'); }
  };
  const later = debounce(flush, 150);
  return {
    async load() {
      try {
        const raw = await DB.get('state');
        if (raw) S = migrate(JSON.parse(raw));
      } catch (e) { console.error(e); }
      return S;
    },
    save() { dirty = true; later(); },
    async now() { dirty = true; await flush(); }
  };
})();
function save() { Store.save(); }
function migrate(s) {
  const d = defaultState();
  const out = Object.assign(d, s);
  out.settings = Object.assign(defaultState().settings, s.settings || {});
  out.program = Object.assign(defaultState().program, s.program || {});
  out.phrases = Object.assign(defaultState().phrases, s.phrases || {});
  out.phrases.custom = Object.assign({ start: [], end: [] }, out.phrases.custom || {});
  out.phrases.bag = Object.assign({ start: [], end: [] }, out.phrases.bag || {});
  out.meta = Object.assign(defaultState().meta, s.meta || {});
  for (const k of ['exercises', 'workouts', 'sessions', 'photos', 'body', 'goals', 'tests', 'deloads', 'pauses']) if (!Array.isArray(out[k])) out[k] = [];
  if (!out.maxes || typeof out.maxes !== 'object') out.maxes = {};
  return out;
}

/* ---- accesso ---- */
const live = a => a.filter(x => !x.deletedAt);
const exById = id => S.exercises.find(e => e.id === id);
const woById = id => S.workouts.find(w => w.id === id);
const exName = id => exById(id)?.name || 'Esercizio';
function activeSession() { return S.sessions.find(s => s.status === 'active' && !s.deletedAt); }
function doneSessions() { return S.sessions.filter(s => s.status === 'done' && !s.deletedAt); }
function sessionsOn(k) { return doneSessions().filter(s => s.date === k); }

/* ---- programma ---- */
function programWeek(k = dkey()) {
  const p = S.program;
  if (!p.start || !p.weeks) return null;
  const n = Math.floor(diffDays(weekStart(p.start), k) / 7) + 1;
  if (n < 1 || n > p.weeks) return { n, out: true };
  const block = (p.blocks || []).find(b => n >= b.from && n <= b.to);
  return { n, total: p.weeks, block, test: (p.testWeeks || []).includes(n) };
}
function pauseOn(k) { return S.pauses.find(p => k >= p.from && k <= p.to); }
function deloadOn(k) {
  const d = S.deloads.find(p => k >= p.from && k <= p.to);
  if (d) return d;
  const p = programWeek(k);
  if (p && !p.out && (S.program.deloadWeeks || []).includes(p.n)) return { pct: S.program.deloadPct || 12, prog: true };
  return null;
}

/* ---- pianificazione di un giorno ---- */
function plannedFor(k) {
  if (pauseOn(k)) return [];
  const dow = isoDow(parseKey(k));
  const week = pwOf(k);
  const ov = S.overrides[k] || {};
  const skip = new Set(ov.skip || []);
  let base = live(S.workouts).filter(w => !w.archived && (w.days || []).includes(dow) && woInWeek(w, week)
    && (!w.from || k >= w.from) && (!w.to || k <= w.to) && !skip.has(w.id));
  const order = S.dayOrder[dow] || [];
  base.sort((a, b) => (b.pinFirst ? 1 : 0) - (a.pinFirst ? 1 : 0)
    || ((order.indexOf(a.id) + 1 || 999) - (order.indexOf(b.id) + 1 || 999))
    || a.title.localeCompare(b.title));
  const added = (ov.add || []).map(woById).filter(w => w && !w.deletedAt && !base.includes(w));
  return base.concat(added);
}
function isDone(k, wid) { return sessionsOn(k).some(s => s.workoutId === wid); }

/* ---- stima durata ---- */
function estMinutes(w, k) {
  let sec = 0;
  const week = k ? pwOf(k) : (w.pw ? (pwOf(dkey()) && woInWeek(w, pwOf(dkey())) ? pwOf(dkey()) : w.pw[0]) : null);
  for (const it of itemsFor(w, week)) {
    const ex = exById(it.exId); const rest = it.rest ?? S.settings.defaultRest;
    const n = (it.sets || []).length;
    for (const st of it.sets || []) {
      const work = ex?.kind === 'time' ? (st.sec || 45) : ex?.kind === 'distance' ? (st.km ? st.km * 360 : 600) : 40;
      sec += work * (ex?.unilateral ? 2 : 1);
    }
    sec += Math.max(0, n - 1) * (it.link ? rest / 2 : rest) + 45;
  }
  return Math.max(5, Math.round(sec / 60 / 5) * 5);
}

/* ---- storico per esercizio ---- */
function historyFor(exId, excludeSessionId) {
  const out = [];
  for (const s of doneSessions()) {
    if (s.id === excludeSessionId) continue;
    for (const it of s.items || []) {
      if (it.exId !== exId) continue;
      const sets = (it.sets || []).filter(x => x.done);
      if (sets.length) out.push({ date: s.date, at: s.startedAt, sets, sessionId: s.id });
    }
  }
  return out.sort((a, b) => a.at - b.at);
}
function lastPerformance(exId, excludeSessionId) {
  const h = historyFor(exId, excludeSessionId);
  return h.length ? h[h.length - 1] : null;
}
function setStrEx(st, kind, exId) { const e = exById(exId); return setStr(st, kind, e?.unit, e?.repsUnit); }
function setStr(st, kind, unit, repsUnit) {
  if (kind === 'time') return fmtSec(st.sec);
  if (kind === 'distance') return fmtNum(st.km) + ' km';
  if (kind === 'measure') return fmtNum(st.km) + (unit ? ' ' + unit : '');
  const r = st.reps2 != null ? `${st.reps ?? '-'}/${st.reps2}` : (st.reps ?? '-');
  if (kind === 'body') return `${r} ${repsUnit === 'passi' ? 'passi' : 'rip'}`;
  const ru = repsUnit === 'm' ? ' m' : '';
  if (st.kg == null || st.kg === '') return `${r}${ru || ' rip'}`;
  return `${fmtNum(st.kg)}×${r}${ru}`;
}
function bestOf(sets, kind) {
  const work = sets.filter(s => s.type !== 'W');
  const b = { kg: 0, e1rm: 0, reps: 0, sec: 0, km: 0, vol: 0 };
  for (const s of work) {
    const reps = Math.max(s.reps || 0, s.reps2 || 0);
    if (kind === 'weight' || kind === 'assisted') {
      if (s.kg != null && reps > 0) { b.kg = Math.max(b.kg, s.kg); if (kind === 'weight') b.e1rm = Math.max(b.e1rm, e1rm(s.kg, reps)); }
    }
    b.reps = Math.max(b.reps, reps);
    b.sec = Math.max(b.sec, s.sec || 0);
    b.km = Math.max(b.km, s.km || 0);
    if (kind === 'weight' && s.kg) b.vol += s.kg * ((s.reps || 0) + (s.reps2 || 0));
  }
  return b;
}
function recordsFor(exId, excludeSessionId) {
  const ex = exById(exId); const kind = ex?.kind || 'weight';
  const r = { kg: 0, e1rm: 0, reps: 0, sec: 0, km: 0, vol: 0 };
  for (const h of historyFor(exId, excludeSessionId)) {
    const b = bestOf(h.sets, kind);
    for (const k in r) r[k] = Math.max(r[k], b[k]);
  }
  return r;
}
function sessionVolume(s) {
  let v = 0;
  for (const it of s.items || []) {
    if ((it.kind || exById(it.exId)?.kind) !== 'weight') continue;
    for (const st of it.sets || []) if (st.done && st.type !== 'W' && st.kg) v += st.kg * ((st.reps || 0) + (st.reps2 || 0));
  }
  return v;
}
function sessionSetsDone(s) { return (s.items || []).reduce((a, it) => a + (it.sets || []).filter(x => x.done).length, 0); }
function sessionSetsTotal(s) { return (s.items || []).reduce((a, it) => a + (it.sets || []).length, 0); }

/* ---- costanza: settimane consecutive rispettate ---- */
function weekStats(ws) {
  let planned = 0, done = 0; const today = dkey();
  for (let i = 0; i < 7; i++) {
    const k = addDays(ws, i);
    if (k > today) break;
    // il riscaldamento (sempre per primo) non conta come seduta da recuperare
    planned += plannedFor(k).filter(w => !w.optional).length;
    done += sessionsOn(k).filter(s => !woById(s.workoutId)?.optional).length;
  }
  return { planned, done };
}
function streakWeeks() {
  let ws = weekStart(dkey()); let n = 0;
  const cur = weekStats(ws);
  if (cur.planned > 0 && cur.done >= cur.planned) n++;
  const first = doneSessions().reduce((m, s) => s.date < m ? s.date : m, dkey());
  for (let i = 0; i < 260; i++) {
    ws = addDays(ws, -7);
    if (ws < weekStart(first)) break;
    const st = weekStats(ws);
    if (st.planned === 0) continue; // settimana in pausa o senza piano: non interrompe
    if (st.done >= st.planned) n++; else break;
  }
  return n;
}

/* ---- peso corporeo più vicino a una data ---- */
function weightAt(k) {
  const b = S.body.filter(x => x.weight && x.date <= k).sort((a, c) => a.date < c.date ? 1 : -1)[0];
  return b ? b.weight : null;
}

/* ---- cestino: pulizia dopo 30 giorni ---- */
async function purgeTrash() {
  const lim = Date.now() - 30 * 86400000;
  const dropBlobs = [];
  for (const k of ['workouts', 'exercises', 'sessions', 'photos']) {
    S[k] = S[k].filter(x => {
      if (x.deletedAt && x.deletedAt < lim) {
        if (k === 'photos') dropBlobs.push(x.blobId, x.thumbId);
        if (k === 'exercises') (x.media || []).forEach(m => dropBlobs.push(m.id, m.thumb, m.id2));
        return false;
      }
      return true;
    });
  }
  for (const id of dropBlobs) if (id) { try { await DB.blobDel(id); BlobURL.drop(id); } catch (e) { } }
  if (dropBlobs.length) save();
}

/* ================= navigazione e componenti ================= */
const NAV = { tab: 'today', stack: [], scroll: {} };
const VIEWS = {};
const A = {};       // azioni ai click: data-a="nome"
const IN = {};      // azioni su input/change: data-in="nome"

function routeKey() { const t = NAV.stack[NAV.stack.length - 1]; return t ? t.view + ':' + (t.id || '') : 'tab:' + NAV.tab; }
function go(view, params = {}) {
  NAV.scroll[routeKey()] = $('#main')?.scrollTop || 0;
  NAV.stack.push(Object.assign({ view }, params));
  render({ reset: true });
}
function back() {
  if (!NAV.stack.length) return;
  NAV.stack.pop();
  render({ restore: true });
}
function setTab(t) {
  if (NAV.tab === t && !NAV.stack.length) { $('#main')?.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  NAV.scroll[routeKey()] = $('#main')?.scrollTop || 0;
  NAV.tab = t; NAV.stack = [];
  render({ restore: true });
}
function top() { return NAV.stack[NAV.stack.length - 1]; }

function render(opts = {}) {
  const main = $('#main');
  const t = top();
  const key = t ? t.view : NAV.tab;
  const v = VIEWS[key];
  if (!v) return;
  const prevScroll = main.scrollTop;
  let html;
  try { html = v.render(t || {}); }
  catch (e) { console.error(e); html = `<div class="page"><div class="empty">${icon('info')}<b>Errore nella schermata</b><span class="small">${esc(e.message)}</span><button class="btn" data-a="back">Indietro</button></div></div>`; }
  main.innerHTML = html;
  const tabbar = $('#tabbar');
  tabbar.hidden = !!v.noTab;
  $$('button', tabbar).forEach(b => b.setAttribute('aria-current', b.dataset.tab === NAV.tab ? 'page' : 'false'));
  if (opts.reset) main.scrollTop = 0;
  else if (opts.restore) main.scrollTop = NAV.scroll[routeKey()] || 0;
  else main.scrollTop = prevScroll;
  try { v.after && v.after(main, t || {}); } catch (e) { console.error(e); }
  hydrateImages(main);
}
function rerender() { render(); }

/* barra superiore per le schermate interne */
function navbar(title, { left = 'back', right = '' } = {}) {
  const l = left === 'back' ? `<button class="navbtn" data-a="back" aria-label="Indietro">${icon('back')}<span>Indietro</span></button>` : left;
  return `<div class="navbar"><div class="l">${l}</div><div class="ttl">${esc(title)}</div><div class="r">${right}</div></div>`;
}

}));

/* swipe dal bordo sinistro per tornare indietro */
(() => {
  let sx = null, sy = 0;
  document.addEventListener('touchstart', e => {
    const t = e.touches[0];
    sx = (t.clientX < 22 && NAV.stack.length && !document.querySelector('.sheet.on,.modal,.cam,.finish,.lock')) ? t.clientX : null; sy = t.clientY;
  }, { passive: true });
  document.addEventListener('touchend', e => {
    if (sx === null) return;
    const t = e.changedTouches[0];
    if (t.clientX - sx > 90 && Math.abs(t.clientY - sy) < 60) back();
    sx = null;
  }, { passive: true });
})();

/* ---- foglio dal basso ---- */
const sheets = [];
function openSheet({ title = '', body = '', onMount, onClose, right = '' }) {
  const scrim = document.createElement('div'); scrim.className = 'scrim';
  const sh = document.createElement('div'); sh.className = 'sheet'; sh.setAttribute('role', 'dialog'); sh.setAttribute('aria-label', title);
  sh.innerHTML = `<div class="grab"></div><div class="sh-h"><b>${esc(title)}</b><div class="hstack">${right}<button class="iconbtn" data-a="closeSheet" aria-label="Chiudi">${icon('x')}</button></div></div><div class="sh-b">${body}</div>`;
  document.body.append(scrim, sh);
  const rec = { scrim, sh, onClose };
  sheets.push(rec);
  requestAnimationFrame(() => { scrim.classList.add('on'); sh.classList.add('on'); });
  scrim.addEventListener('click', () => closeSheet());
  // trascina in basso per chiudere
  let y0 = null, dy = 0;
  const grab = sh.querySelector('.grab'), hd = sh.querySelector('.sh-h');
  [grab, hd].forEach(h => {
    h.addEventListener('touchstart', e => { y0 = e.touches[0].clientY; dy = 0; sh.style.transition = 'none'; }, { passive: true });
    h.addEventListener('touchmove', e => { if (y0 === null) return; dy = Math.max(0, e.touches[0].clientY - y0); sh.style.transform = `translateY(${dy}px)`; }, { passive: true });
    h.addEventListener('touchend', () => { sh.style.transition = ''; sh.style.transform = ''; if (dy > 90) closeSheet(); y0 = null; });
  });
  onMount && onMount(sh.querySelector('.sh-b'), sh);
  hydrateImages(sh);
  return rec;
}
function closeSheet(all = false) {
  const n = all ? sheets.length : 1;
  for (let i = 0; i < n; i++) {
    const rec = sheets.pop(); if (!rec) return;
    rec.scrim.classList.remove('on'); rec.sh.classList.remove('on');
    setTimeout(() => { rec.scrim.remove(); rec.sh.remove(); }, 260);
    rec.onClose && rec.onClose();
  }
}

/* ---- finestre di conferma (alert/confirm del browser non sono affidabili nelle app sulla Home) ---- */
function modal(inner) {
  return new Promise(res => {
    const m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = `<div class="mc" role="alertdialog">${inner}</div>`;
    document.body.append(m);
    const done = v => { m.remove(); res(v); };
    m.addEventListener('click', e => {
      if (e.target === m) return done(null);
      const b = e.target.closest('[data-m]');
      if (!b) return;
      if (b.dataset.m === 'ok') { const i = m.querySelector('input,textarea'); done(i ? i.value : true); }
      else done(null);
    });
    m.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') { done(e.target.value); } });
    const i = m.querySelector('input'); if (i) setTimeout(() => { i.focus(); i.select(); }, 60);
  });
}
function confirmBox({ title, text = '', ok = 'Conferma', danger = false, cancel = 'Annulla' }) {
  return modal(`<h3>${esc(title)}</h3>${text ? `<p>${text}</p>` : ''}<div class="btn-row"><button class="btn" data-m="no">${esc(cancel)}</button><button class="btn ${danger ? 'danger' : 'primary'}" data-m="ok">${esc(ok)}</button></div>`).then(v => !!v);
}
function promptBox({ title, value = '', placeholder = '', ok = 'Salva', mode = 'text' }) {
  const im = mode === 'decimal' ? 'inputmode="decimal"' : mode === 'numeric' ? 'inputmode="numeric"' : '';
  return modal(`<h3>${esc(title)}</h3><input class="inp" id="modal-in" ${im} value="${esc(value)}" placeholder="${esc(placeholder)}"><div class="btn-row"><button class="btn" data-m="no">Annulla</button><button class="btn primary" data-m="ok">${esc(ok)}</button></div>`);
}
function choiceBox({ title, options }) { // options: [{v,label,danger}]
  return modal(`<h3>${esc(title)}</h3><div class="stack">${options.map(o => `<button class="btn block ${o.danger ? 'danger' : ''}" data-m="c" data-v="${esc(o.v)}">${esc(o.label)}</button>`).join('')}<button class="btn ghost block" data-m="no">Annulla</button></div>`)
    .then(() => null);
}
function pick({ title, options }) {
  return new Promise(res => {
    const m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = `<div class="mc"><h3>${esc(title)}</h3><div class="stack">${options.map((o, i) => `<button class="btn block ${o.danger ? 'danger' : ''}" data-i="${i}">${o.icon ? icon(o.icon, 'sm') : ''}${esc(o.label)}</button>`).join('')}<button class="btn ghost block" data-i="-1">Annulla</button></div></div>`;
    document.body.append(m);
    m.addEventListener('click', e => {
      if (e.target === m) { m.remove(); return res(null); }
      const b = e.target.closest('[data-i]'); if (!b) return;
      m.remove(); const i = +b.dataset.i; res(i < 0 ? null : options[i].v);
    });
  });
}

/* ---- avvisi brevi ---- */
let toastT = null;
function toast(msg, { undo, pr = false, ms = 2400 } = {}) {
  $('.toast')?.remove();
  const t = document.createElement('div'); t.className = 'toast' + (pr ? ' pr' : '');
  t.setAttribute('role', 'status');
  t.innerHTML = `${pr ? icon('trophy', 'sm') : ''}<span>${esc(msg)}</span>${undo ? '<button>Annulla</button>' : ''}`;
  if (!$('#tabbar') || $('#tabbar').hidden) t.style.bottom = 'calc(env(safe-area-inset-bottom,0px) + 90px)';
  document.body.append(t);
  requestAnimationFrame(() => t.classList.add('on'));
  if (undo) t.querySelector('button').onclick = () => { undo(); t.remove(); };
  clearTimeout(toastT);
  toastT = setTimeout(() => { t.classList.remove('on'); setTimeout(() => t.remove(), 250); }, undo ? 5500 : ms);
}

/* ---- frase motivazionale: niente ripetizioni finché non sono uscite tutte ---- */
function phrasePool(kind) {
  const hidden = new Set(S.phrases.hidden);
  const base = PHRASES[kind].map((t, i) => ({ k: kind[0] + i, t }));
  const custom = (S.phrases.custom[kind] || []).map((t, i) => ({ k: 'c' + kind[0] + i + ':' + t.slice(0, 12), t }));
  return base.concat(custom).filter(p => !hidden.has(p.k));
}
function dataPhrase(kind) {
  const out = [];
  const st = streakWeeks();
  const n = doneSessions().length;
  const month = doneSessions().filter(s => s.date.slice(0, 7) === dkey().slice(0, 7)).length;
  if (kind === 'start') {
    if (st >= 2) out.push(`${st} settimane di fila rispettate. Non rompere la catena proprio oggi.`);
    if (month >= 3) out.push(`Seduta numero ${month + 1} del mese. Il ritmo c'è.`);
  } else {
    if ((n + 0) % 25 === 0 && n) out.push(`${n} sedute registrate. Numeri veri.`);
    if (st >= 3) out.push(`${st} settimane consecutive. Questa si chiama costanza.`);
    if (month >= 4) out.push(`${month} sedute questo mese.`);
  }
  return out;
}
function nextPhrase(kind) {
  const d = dataPhrase(kind);
  if (d.length && Math.random() < 0.25) return d[Math.floor(Math.random() * d.length)];
  const pool = phrasePool(kind);
  if (!pool.length) return '';
  let bag = (S.phrases.bag[kind] || []).filter(k => pool.some(p => p.k === k));
  if (!bag.length) bag = shuffle(pool.map(p => p.k));
  const k = bag.shift();
  S.phrases.bag[kind] = bag; save();
  return pool.find(p => p.k === k)?.t || '';
}
function showQuote(kind, text) {
  if (!S.settings.quotes) return;
  const t = text || nextPhrase(kind);
  if (!t) return;
  const q = document.createElement('div'); q.className = 'quote';
  q.innerHTML = `<div class="qc"><div class="qk">${kind === 'start' ? 'Si parte' : 'Allenamento finito'}</div><div class="qt">${esc(t)}</div><div class="qbar"><i></i></div></div>`;
  document.body.append(q);
  const close = () => { q.style.transition = 'opacity .2s'; q.style.opacity = '0'; setTimeout(() => q.remove(), 200); };
  q.addEventListener('click', close);
  setTimeout(close, 4200);
}

/* ---- tema ---- */
function applyTheme() {
  const r = document.documentElement;
  const t = S.settings.theme;
  if (t === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', t);
  r.setAttribute('data-accent', S.settings.accent || 'blue');
  r.setAttribute('data-big', S.settings.big ? '1' : '0');
  const dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  const mc = document.querySelector('meta[name="theme-color"]');
  if (mc) mc.setAttribute('content', dark ? '#0A0C0F' : '#F3F4F6');
}
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => applyTheme());

A.woDayMenu = async (el, ev) => {
  ev.stopPropagation();
  const id = el.dataset.id, k = el.dataset.k;
  const w = woById(id);
  const added = (S.overrides[k]?.add || []).includes(id);
  const opts = [];
  if (!isDone(k, id) && k <= dkey()) opts.push({ v: 'done', label: 'Segna come fatto', icon: 'check' });
  opts.push({ v: 'move', label: 'Sposta a un altro giorno', icon: 'move' });
  opts.push({ v: 'skip', label: added ? 'Togli da questo giorno' : 'Salta solo questo giorno', icon: 'skip' });
  opts.push({ v: 'edit', label: 'Modifica workout', icon: 'edit' });
  const v = await pick({ title: w.title, options: opts });
  if (!v) return;
  const ov = S.overrides[k] = S.overrides[k] || { skip: [], add: [] };
  ov.skip = ov.skip || []; ov.add = ov.add || [];
  const removeFromDay = () => { if (added) ov.add = ov.add.filter(x => x !== id); else if (!ov.skip.includes(id)) ov.skip.push(id); };
  if (v === 'done') { quickDone(id, k); }
  if (v === 'skip') {
    removeFromDay(); save(); rerender();
    toast('Saltato per ' + relDay(k), { undo: () => { if (added) ov.add.push(id); else ov.skip = ov.skip.filter(x => x !== id); save(); rerender(); } });
  }
  if (v === 'move') {
    const to = await dateBox({ title: 'Sposta a', value: addDays(k, 1), ok: 'Sposta' });
    if (!to || to === k) return;
    removeFromDay();
    const o2 = S.overrides[to] = S.overrides[to] || { skip: [], add: [] };
    o2.skip = (o2.skip || []).filter(x => x !== id); o2.add = o2.add || [];
    if (!plannedFor(to).some(x => x.id === id)) o2.add.push(id);
    save(); rerender(); toast(`Spostato a ${relDay(to)}`);
  }
  if (v === 'edit') go('woEdit', { id });
};
function quickDone(wid, k) {
  const w = woById(wid);

  S.sessions.push({ id: uid(), date: k, workoutId: wid, title: w ? w.title : 'Allenamento', startedAt: now, endedAt: now, status: 'done', quick: true, items: [], note: '' });

A.addToDay = async (el) => {
  const k = el.dataset.k;
  const cur = new Set(plannedFor(k).map(w => w.id));
  const list = live(S.workouts).filter(w => !w.archived && !cur.has(w.id));
  if (!list.length) return toast(S.workouts.length ? 'Tutti i workout sono già in questo giorno' : 'Crea prima un workout');
  const id = await pick({ title: 'Aggiungi a ' + relDay(k), options: list.map(w => ({ v: w.id, label: (w.icon || '') + ' ' + w.title })) });
  if (!id) return;
  const ov = S.overrides[k] = S.overrides[k] || { skip: [], add: [] };
  ov.skip = (ov.skip || []).filter(x => x !== id); ov.add = ov.add || [];
  if (!plannedFor(k).some(w => w.id === id)) ov.add.push(id);
  save(); rerender();
};

/* riordino con trascinamento (maniglia) */
function makeSortable(container, itemSel, handleSel, onDone) {
  let drag = null;
  container.addEventListener('pointerdown', e => {
    const h = e.target.closest(handleSel); if (!h || !container.contains(h)) return;
    const el = h.closest(itemSel); if (!el) return;
    e.preventDefault();
    const items = $$(itemSel, container);
    drag = { el, y0: e.clientY, items, idx: items.indexOf(el), rects: items.map(i => i.getBoundingClientRect()), to: items.indexOf(el) };
    el.classList.add('dragging'); h.setPointerCapture(e.pointerId);
  });
  container.addEventListener('pointermove', e => {
    if (!drag) return;
    const dy = e.clientY - drag.y0;
    drag.el.style.transform = `translateY(${dy}px)`;
    const mid = drag.rects[drag.idx].top + drag.rects[drag.idx].height / 2 + dy;
    let to = drag.idx;
    drag.rects.forEach((r, i) => { if (i < drag.idx && mid < r.top + r.height / 2) to = Math.min(to, i); if (i > drag.idx && mid > r.top + r.height / 2) to = Math.max(to, i); });
    drag.to = to;
    const hgt = drag.rects[drag.idx].height + 0;
    drag.items.forEach((it, i) => {
      if (it === drag.el) return;
      let off = 0;
      if (drag.idx < to && i > drag.idx && i <= to) off = -hgt;
      if (drag.idx > to && i < drag.idx && i >= to) off = hgt;
      it.style.transition = 'transform .15s'; it.style.transform = off ? `translateY(${off}px)` : '';
    });
  });
  const end = () => {

function itemSummary(it) {

    r = same ? `${work.length} × ${reps[0] ?? '—'}` : reps.join(', ');

function loadImg(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Immagine non leggibile')); i.src = src; }); }
function canvasBlob(c, q = 0.82) { return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('Conversione non riuscita')), 'image/jpeg', q)); }
// ridimensiona (lato lungo max) e comprime; l'orientamento EXIF viene applicato dal browser
async function processImage(fileOrBlob, max = 1600, q = 0.82, thumbMax = 360) {
  const url = URL.createObjectURL(fileOrBlob);
  try {
    const img = await loadImg(url);
    const draw = (m, qq) => {
      const sc = Math.min(1, m / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      return canvasBlob(c, qq);
    };
    return { blob: await draw(max, q), thumb: await draw(thumbMax, 0.75), w: img.naturalWidth, h: img.naturalHeight };
  } finally { URL.revokeObjectURL(url); }
}
function pickFiles({ accept = 'image/*', multiple = false } = {}) {
  return new Promise(res => {
    const i = document.createElement('input'); i.type = 'file'; i.accept = accept; i.multiple = multiple;
    i.style.position = 'fixed'; i.style.left = '-9999px';
    document.body.append(i);
    i.addEventListener('change', () => { res(Array.from(i.files || [])); i.remove(); }, { once: true });
    i.click();
  });
}

/* ---- suono: su iPhone parte solo dopo un tocco; l'avviso visivo c'è sempre ---- */
const Sound = (() => {
  let ctx = null;
  return {
    unlock() {
      try {
        if (navigator.audioSession) navigator.audioSession.type = 'transient';
        ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume();
        const o = ctx.createOscillator(), g = ctx.createGain(); g.gain.value = 0.0001; o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + 0.02);
      } catch (e) { }
    },
    beep(times = 3, freq = 880) {
      if (!S.settings.sound) return;
      try {
        ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume();
        for (let i = 0; i < times; i++) {
          const t = ctx.currentTime + i * 0.28;
          const o = ctx.createOscillator(), g = ctx.createGain();
          o.type = 'sine'; o.frequency.value = i === times - 1 ? freq * 1.5 : freq;
          g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.5, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
          o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + 0.24);
        }
      } catch (e) { }
    }
  };
})();

/* ---- schermo sempre acceso ---- */
const Wake = (() => {
  let lock = null, want = false;
  async function req() {
    if (!want || lock || document.visibilityState !== 'visible') return;
    try { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { lock = null; }); } catch (e) { lock = null; }
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') req(); });
  return { on() { want = true; req(); }, off() { want = false; try { lock && lock.release(); } catch (e) { } lock = null; } };
})();

    pctOf: it.pctOf || null, test: it.test || null, progKey: it.progKey || null,

  };

async function startSession(workoutId) {

  Sound.unlock();
  const w = workoutId ? woById(workoutId) : null;
  const k = dkey();
  const dl = deloadOn(k);
  const week = pwOf(k);
  const s = { id: uid(), date: k, pw: week, workoutId: w ? w.id : null, title: w ? w.title : 'Allenamento libero', startedAt: Date.now(), status: 'active', items: [], note: '', rpe: null, prs: [] };
  if (w) s.items = itemsFor(w, week).filter(it => exById(it.exId)).map(snapItem);
  if (dl) s.items.forEach(it => it.sets.forEach(st => { if (st.t.kg) st.t.kg = roundKg(st.t.kg * (1 - dl.pct / 100)); }));
  S.sessions.push(s);
  await Store.now();
  NAV.stack = []; go('session');
  showQuote('start');
  try { navigator.storage?.persist?.(); } catch (e) { }
}

/* valori suggeriti per una serie: volta scorsa, altrimenti obiettivo del workout */
function prevFor(s, it) {
  if (!it._prev) it._prev = lastPerformance(it.exId, s.id) || null; // cache in memoria (non salvata)
  return it._prev;
}
function placeholderFor(s, it, j) {
  const st = it.sets[j]; const prev = prevFor(s, it);
  const ps = prev ? (prev.sets.filter(x => x.type === st.type)[it.sets.slice(0, j).filter(x => x.type === st.type).length] || prev.sets[j]) : null;
  const t = st.t || {};
  let kg = null;
  if (t.pct) kg = pctKg(it.pctOf || it.exId, t.pct);
  if (kg == null && t.kg != null) kg = t.kg;
  if (kg == null && ps?.kg != null) { kg = ps.kg; const dl = deloadOn(s.date); if (dl && it.kind === 'weight') kg = roundKg(kg * (1 - dl.pct / 100)); }
  return {
    kg,
    pct: t.pct || null,
    reps: t.repsMax ? null : (t.reps ?? ps?.reps ?? null),
    repsHint: t.repsMax ? `${t.reps}-${t.repsMax}` : null,
    reps2: t.reps ?? ps?.reps2 ?? ps?.reps ?? null,
    sec: t.sec ?? ps?.sec ?? null,
    km: t.km ?? ps?.km ?? null,
    prev: ps
  };
}
function suggestionFor(s, it) {
  if (it.kind !== 'weight') return null;
  const prev = prevFor(s, it); if (!prev) return null;
  const work = prev.sets.filter(x => x.type === 'N');
  if (!work.length || work.some(x => x.kg == null)) return null;
  const tWork = it.sets.filter(x => x.type === 'N');
  const allHit = work.every((x, i) => { const t = tWork[i]?.t || tWork[0]?.t || {}; const goal = t.repsMax || t.reps; return goal ? (x.reps || 0) >= goal : false; });
  if (!allHit) return null;
  const maxKg = Math.max(...work.map(x => x.kg));
  return roundKg(maxKg + (S.settings.increment || 2.5));
}

function exBlock(s, it, i) {
  const ex = exById(it.exId);
  const prev = prevFor(s, it);
  const sug = suggestionFor(s, it);
  const hasMedia = ex && (ex.media || []).length;
  const sup = it.link || s.items[i + 1]?.link;
  const kind = it.kind;
  const two = kind === 'body' || kind === 'distance' || kind === 'time' || kind === 'measure';
  const c2 = kind === 'time' ? 'Tempo' : kind === 'distance' ? 'Km' : kind === 'measure' ? (ex?.unit || 'Valore') : kind === 'body' ? (ex?.repsUnit === 'passi' ? 'Passi' : 'Rip.') : (kind === 'assisted' ? '± kg' : 'Kg');
  const c3 = two ? '' : (ex?.repsUnit === 'm' ? 'Metri' : it.unilateral ? 'Dx / Sx' : 'Rip.');

      ${sup ? `<div class="tiny" style="color:var(--accent);font-weight:700">Superserie${s.items[i + 1]?.link ? ': passa al prossimo senza recupero' : ''}</div>` : ''}
